<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/images/logo.png">
<title>FundaPlus — Past Papers Library</title>
<style>
*,::after,::before{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f6fc;--surf:#fff;--brd:#e3e8f4;--acc:#2563eb;--acc2:#1d4ed8;--acc-soft:#eff4ff;--txt:#0f172a;--mut:#64748b;--ok:#16a34a;--err:#dc2626;--rad:14px;--sh:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(37,99,235,.07)}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.topbar{background:var(--surf);border-bottom:1px solid var(--brd);padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:900;font-size:1rem;color:var(--txt)}
.brand img{border-radius:9px}
.brand small{font-weight:600;color:var(--mut);font-size:.78rem}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{padding:9px 16px;border-radius:9px;border:none;cursor:pointer;font-size:.83rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:.13s;font-family:inherit}
.btn-p{background:var(--acc);color:#fff}
.btn-p:hover{background:var(--acc2)}
.btn-out{background:var(--surf);color:var(--acc);border:1.5px solid var(--acc)}
.btn-out:hover{background:var(--acc-soft)}
.btn-ghost{background:transparent;color:var(--mut)}
.btn-ghost:hover{background:#eef1f7;color:var(--txt)}
.layout{max-width:1280px;margin:0 auto;padding:26px 18px 70px;display:flex;gap:22px;align-items:flex-start}
.side{width:262px;flex-shrink:0;background:var(--surf);border:1px solid var(--brd);border-radius:var(--rad);box-shadow:var(--sh);padding:14px;position:sticky;top:82px}
.side h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);padding:6px 10px 10px}
.folder{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;background:transparent;border-radius:10px;cursor:pointer;font-size:.87rem;font-weight:600;color:var(--txt);font-family:inherit;text-align:left;transition:.12s}
.folder:hover{background:#f1f4fa}
.folder.active{background:var(--acc-soft);color:var(--acc)}
.folder .fic{font-size:1.05rem;width:24px;text-align:center}
.folder .cnt{margin-left:auto;font-size:.72rem;font-weight:800;background:#eef1f7;color:var(--mut);border-radius:99px;padding:2px 9px}
.folder.active .cnt{background:var(--acc);color:#fff}
.side .hint{font-size:.75rem;color:var(--mut);padding:10px;line-height:1.5;border-top:1px solid var(--brd);margin-top:10px}
.main{flex:1;min-width:0}
.lib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.lib-title{font-size:1.5rem;font-weight:900;letter-spacing:-.5px}
.lib-sub{font-size:.85rem;color:var(--mut);margin-top:4px}
.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:10px 14px;border:1.5px solid var(--brd);border-radius:10px;font-size:.87rem;outline:0;background:var(--surf);color:var(--txt);font-family:inherit}
.toolbar input{flex:1;min-width:200px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rad);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .14s,box-shadow .14s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(37,99,235,.12)}
.card-top{display:flex;gap:11px;align-items:flex-start}
.picon{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#fee2e2,#fecaca);display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0}
.card-title{font-size:.9rem;font-weight:800;line-height:1.35;word-break:break-word}
.card-meta{font-size:.73rem;color:var(--mut);display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.68rem;font-weight:700;background:#f1f5f9;color:var(--mut)}
.pill.lv{background:var(--acc-soft);color:var(--acc)}
.card-desc{font-size:.78rem;color:var(--mut);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-actions{display:flex;gap:8px;margin-top:auto}
.dl-btn{position:relative;overflow:hidden;flex:1;justify-content:center}
.dl-btn .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.28);transition:width .15s}
.dl-btn .lbl{position:relative;z-index:1}
.view-btn{flex:1;justify-content:center}
.empty{text-align:center;padding:70px 20px;color:var(--mut);grid-column:1/-1}
.empty .eicon{font-size:3rem;margin-bottom:12px}
.count-line{font-size:.8rem;color:var(--mut);margin-bottom:14px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.62);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--surf);border-radius:16px;width:min(920px,100%);height:min(90vh,720px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.modal-hdr{padding:13px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px}
.modal-title{font-weight:800;font-size:.92rem;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mx{background:0 0;border:none;cursor:pointer;font-size:1.15rem;color:var(--mut);padding:5px 8px;border-radius:7px}
.mx:hover{background:var(--bg)}
.modal iframe{flex:1;border:none;width:100%;background:#525659}
#toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(360px,90vw)}
.toast{background:#0f172a;color:#fff;border-radius:12px;padding:12px 16px;font-size:.83rem;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.3);display:flex;gap:9px;align-items:flex-start;animation:tin .25s ease}
.toast.ok{border-left:4px solid var(--ok)}
.toast.err{border-left:4px solid var(--err)}
.toast.info{border-left:4px solid var(--acc)}
.toast .tp{height:4px;background:rgba(255,255,255,.2);border-radius:99px;margin-top:8px;overflow:hidden}
.toast .tp i{display:block;height:100%;width:0;background:#fff;border-radius:99px}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.toast.out{opacity:0;transform:translateX(30px);transition:.3s}
.up-wrap{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rad);box-shadow:var(--sh);padding:20px;margin-bottom:20px;display:none}
.up-wrap.open{display:block}
.up-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:.76rem;font-weight:700;margin-bottom:5px;color:var(--mut)}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;border:1.5px solid var(--brd);border-radius:9px;font-size:.86rem;outline:0;color:var(--txt);background:#fff;font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--acc)}
.up-bar{height:8px;background:#eef1f7;border-radius:99px;overflow:hidden;margin:12px 0;display:none}
.up-bar.show{display:block}
.up-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#60a5fa);border-radius:99px;transition:width .15s}
.drop{border:1.5px dashed var(--brd);border-radius:10px;padding:20px;text-align:center;cursor:pointer;font-size:.84rem;color:var(--mut);transition:.13s}
.drop:hover{border-color:var(--acc);background:var(--acc-soft)}
@media(max-width:860px){.layout{flex-direction:column}.side{width:100%;position:static}.side .folders{display:grid;grid-template-columns:1fr 1fr}.up-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><img src="/images/logo.png" width="30" height="30" alt="Fundo Plus">FundaPlus <small>Past Papers Library</small></a>
  <div class="top-actions">
    <a class="btn btn-ghost" href="/dashboard">Dashboard</a>
    <a class="btn btn-ghost" href="/resources">Resources</a>
    <button class="btn btn-p" id="shareBtn">+ Share Paper</button>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <h3>Folders</h3>
    <div class="folders" id="folders"></div>
    <div class="hint" id="libHint"></div>
  </aside>

  <section class="main">
    <div class="up-wrap" id="upWrap">
      <h3 style="font-size:1rem;font-weight:800;margin-bottom:4px">Share a past paper</h3>
      <p style="font-size:.8rem;color:var(--mut);margin-bottom:14px">PDF only, max 20 MB. Shared papers are public to the community.</p>
      <div class="up-grid">
        <div class="fg"><label>Title *</label><input id="upTitle" placeholder="e.g. O-Level Mathematics Paper 1 (2024)"></div>
        <div class="fg"><label>Subject</label><input id="upSubject" placeholder="e.g. Mathematics"></div>
        <div class="fg"><label>Level</label>
          <select id="upLevel"><option value="">Any</option><option>O-Level</option><option>A-Level</option><option>Grade 7</option><option>HEXCO</option><option>Primary</option><option>University</option><option>Other</option></select>
        </div>
        <div class="fg"><label>Year</label><input id="upYear" placeholder="e.g. 2024" inputmode="numeric"></div>
      </div>
      <div class="fg"><label>Description</label><textarea id="upDesc" rows="2" placeholder="Short description of the paper..."></textarea></div>
      <div class="fg"><label>PDF file *</label>
        <div class="drop" id="dropZone">Click to choose a PDF<span id="upFileName" style="display:block;color:var(--acc);font-weight:700;margin-top:4px"></span></div>
        <input type="file" id="upFile" accept=".pdf,application/pdf" style="display:none">
      </div>
      <div class="up-bar" id="upBar"><i></i></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-p" id="upGo">Upload Paper</button>
        <button class="btn btn-ghost" id="upCancel">Cancel</button>
      </div>
    </div>

    <div class="lib-head">
      <div><div class="lib-title" id="folderTitle">All Papers</div><div class="lib-sub" id="folderSub"></div></div>
    </div>
    <div class="toolbar">
      <input id="q" placeholder="Search title, subject, year...">
      <select id="subjectSel"><option value="">All subjects</option></select>
      <select id="sortSel"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">Title A–Z</option><option value="size">Largest first</option></select>
    </div>
    <div class="count-line" id="countLine"></div>
    <div class="grid" id="grid"><div class="empty"><div class="eicon">📚</div><p>Loading library...</p></div></div>
  </section>
</div>

<div class="modal-bg" id="pdfModal">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title" id="modalTitle">Preview</span>
      <button class="btn btn-p" id="modalDl" style="padding:7px 14px">Download</button>
      <button class="mx" id="modalX">✕</button>
    </div>
    <iframe id="pdfFrame" title="PDF Preview"></iframe>
  </div>
</div>

<div id="toasts"></div>

<script>
const _token = localStorage.getItem('fp_session');
if (!_token) window.location.replace('/login');

const FOLDERS = [
  { id: 'all',    label: 'All Papers',           icon: '📚' },
  { id: 'o-past', label: 'O Level Past Papers',  icon: '📝' },
  { id: 'o-spec', label: 'O Level Specimen',     icon: '📋' },
  { id: 'a-past', label: 'A Level Past Papers',  icon: '📝' },
  { id: 'a-spec', label: 'A Level Specimen',     icon: '📋' },
  { id: 'g7',     label: 'Grade 7',              icon: '🎒' },
  { id: 'hexco',  label: 'HEXCO',                icon: '🎓' },
  { id: 'other',  label: 'Other',                icon: '📁' }
];

let _papers = [], _folder = 'all', _modalPaper = null;

function esc(t) {
  return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtSize(b) {
  if (!b) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return Math.round(b / 1024) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

function folderOf(p) {
  const lv = String(p.level || '').toLowerCase();
  const t = String(p.originalName || '').toLowerCase();
  const spec = t.indexOf('specimen') !== -1;
  if (lv.indexOf('o-level') !== -1 || lv === 'o level') return spec ? 'o-spec' : 'o-past';
  if (lv.indexOf('a-level') !== -1 || lv === 'a level') return spec ? 'a-spec' : 'a-past';
  if (lv.indexOf('grade 7') !== -1 || lv === 'grade7' || t.indexOf('grade 7') === 0) return 'g7';
  if (lv.indexOf('hexco') !== -1 || t.indexOf('hexco') === 0) return 'hexco';
  return 'other';
}

function toast(msg, type, sticky) {
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.innerHTML = '<div style="flex:1">' + msg + '</div>';
  box.appendChild(el);
  if (!sticky) setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 350); }, 4200);
  return el;
}

function dlToast(title) {
  const el = toast('<div>' + esc(title) + '</div><div class="tp"><i></i></div>', 'info', true);
  const bar = el.querySelector('.tp i');
  return {
    progress: (pct) => { bar.style.width = Math.max(0, Math.min(100, pct)) + '%'; },
    done: (ok, msg) => {
      el.classList.remove('info'); el.classList.add(ok ? 'ok' : 'err');
      el.querySelector('div').firstChild.textContent = msg;
      el.querySelector('.tp').remove();
      setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 350); }, 3500);
    }
  };
}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { 'x-session-token': _token } }, opts || {}));
  if (res.status === 401) { localStorage.clear(); window.location.replace('/login'); throw new Error('signed out'); }
  return res;
}

async function loadLibrary() {
  try {
    const res = await api('/api/papers');
    const d = await res.json();
    _papers = (d.papers || []).filter(p => p.publicUrl || p.filename);
    buildSubjects();
    renderFolders();
    renderGrid();
    document.getElementById('libHint').textContent = _papers.length + ' papers in the library. Pick a folder or search to find what you need.';
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="empty"><div class="eicon">😕</div><p>Could not load the library: ' + esc(e.message) + '</p></div>';
  }
}

function buildSubjects() {
  const sel = document.getElementById('subjectSel');
  const subs = Array.from(new Set(_papers.map(p => (p.subject || 'General').trim()).filter(Boolean))).sort();
  sel.innerHTML = '<option value="">All subjects</option>' + subs.map(s => '<option>' + esc(s) + '</option>').join('');
}

function renderFolders() {
  const counts = { all: _papers.length };
  _papers.forEach(p => { const f = folderOf(p); counts[f] = (counts[f] || 0) + 1; });
  const box = document.getElementById('folders');
  box.innerHTML = '';
  FOLDERS.forEach(f => {
    const b = document.createElement('button');
    b.className = 'folder' + (_folder === f.id ? ' active' : '');
    b.innerHTML = '<span class="fic">' + f.icon + '</span><span>' + esc(f.label) + '</span><span class="cnt">' + (counts[f.id] || 0) + '</span>';
    b.addEventListener('click', () => { _folder = f.id; renderFolders(); renderGrid(); });
    box.appendChild(b);
  });
  const cur = FOLDERS.find(f => f.id === _folder);
  document.getElementById('folderTitle').textContent = cur ? cur.label : 'All Papers';
}

function currentList() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const subj = document.getElementById('subjectSel').value;
  const sort = document.getElementById('sortSel').value;
  let list = _papers.slice();
  if (_folder !== 'all') list = list.filter(p => folderOf(p) === _folder);
  if (subj) list = list.filter(p => (p.subject || 'General').trim() === subj);
  if (q) list = list.filter(p => ((p.originalName || '') + ' ' + (p.subject || '') + ' ' + (p.description || '') + ' ' + (p.year || '')).toLowerCase().indexOf(q) !== -1);
  if (sort === 'new') list.sort((a, b) => String(b.uploadedAt || '').localeCompare(String(a.uploadedAt || '')));
  else if (sort === 'old') list.sort((a, b) => String(a.uploadedAt || '').localeCompare(String(b.uploadedAt || '')));
  else if (sort === 'az') list.sort((a, b) => String(a.originalName || '').localeCompare(String(b.originalName || '')));
  else if (sort === 'size') list.sort((a, b) => (b.size || 0) - (a.size || 0));
  return list;
}

function fileUrl(p, mode) {
  if (p.publicUrl) return p.publicUrl;
  return '/api/papers/file/' + encodeURIComponent(p.filename) + '?mode=' + (mode || 'download') + '&token=' + encodeURIComponent(_token);
}

function renderGrid() {
  const list = currentList();
  const g = document.getElementById('grid');
  document.getElementById('folderSub').textContent = list.length + ' paper' + (list.length === 1 ? '' : 's');
  document.getElementById('countLine').textContent = list.length ? ('Showing ' + list.length + ' of ' + _papers.length + ' papers') : '';
  if (!list.length) {
    g.innerHTML = '<div class="empty"><div class="eicon">📭</div><p>Nothing here yet. Try another folder or share the first paper.</p></div>';
    return;
  }
  g.innerHTML = '';
  list.forEach(p => {
    const name = p.originalName || p.filename || 'Paper';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-top"><div class="picon">📄</div><div style="flex:1;min-width:0">' +
      '<div class="card-title">' + esc(name) + '</div>' +
      '<div class="card-meta">' +
      (p.level ? '<span class="pill lv">' + esc(p.level) + '</span>' : '') +
      (p.subject ? '<span class="pill">' + esc(p.subject) + '</span>' : '') +
      (p.year ? '<span>🗓 ' + esc(p.year) + '</span>' : '') +
      (p.size ? '<span>💾 ' + fmtSize(p.size) + '</span>' : '') +
      '</div></div></div>' +
      (p.description ? '<div class="card-desc">' + esc(p.description) + '</div>' : '') +
      '<div class="card-actions">' +
      '<button class="btn btn-out view-btn">👁 Preview</button>' +
      '<button class="btn btn-p dl-btn"><span class="bar"></span><span class="lbl">⬇ Download</span></button>' +
      '</div>';
    card.querySelector('.view-btn').addEventListener('click', () => openPreview(p));
    const dlBtn = card.querySelector('.dl-btn');
    dlBtn.addEventListener('click', () => downloadPaper(p, dlBtn));
    g.appendChild(card);
  });
}

async function downloadPaper(p, btn) {
  const name = p.originalName || p.filename || 'paper.pdf';
  const bar = btn ? btn.querySelector('.bar') : null;
  const lbl = btn ? btn.querySelector('.lbl') : null;
  const ft = dlToast('Downloading ' + name);
  if (btn) { btn.disabled = true; if (lbl) lbl.textContent = 'Starting...'; }
  try {
    const res = await api('/api/papers/file/' + encodeURIComponent(p.filename) + '?mode=download');
    if (!res.ok) throw new Error(res.status === 404 ? 'file not found on server' : 'server error ' + res.status);
    const total = parseInt(res.headers.get('content-length') || '0', 10) || p.size || 0;
    const reader = res.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const r = await reader.read();
      if (r.done) break;
      chunks.push(r.value);
      got += r.value.length;
      const pct = total ? Math.round(got / total * 100) : 0;
      if (bar) bar.style.width = (total ? pct : (got % 100)) + '%';
      if (lbl) lbl.textContent = total ? (pct + '%') : (fmtSize(got));
      ft.progress(total ? pct : 50);
    }
    const blob = new Blob(chunks, { type: 'application/pdf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name.endsWith('.pdf') ? name : name + '.pdf';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    ft.done(true, 'Saved ' + name);
    if (lbl) lbl.textContent = '⬇ Download';
    if (bar) bar.style.width = '0';
  } catch (e) {
    ft.done(false, 'Download failed: ' + e.message);
    if (lbl) lbl.textContent = 'Retry';
    if (bar) bar.style.width = '0';
  }
  if (btn) btn.disabled = false;
}

function openPreview(p) {
  _modalPaper = p;
  document.getElementById('modalTitle').textContent = p.originalName || p.filename || 'Preview';
  document.getElementById('pdfFrame').src = fileUrl(p, 'inline');
  document.getElementById('pdfModal').classList.add('open');
}

function closePreview() {
  document.getElementById('pdfModal').classList.remove('open');
  document.getElementById('pdfFrame').src = '';
  _modalPaper = null;
}

document.getElementById('modalX').addEventListener('click', closePreview);
document.getElementById('modalDl').addEventListener('click', () => { if (_modalPaper) downloadPaper(_modalPaper, null); });
document.getElementById('pdfModal').addEventListener('click', e => { if (e.target === e.currentTarget) closePreview(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });

document.getElementById('q').addEventListener('input', renderGrid);
document.getElementById('subjectSel').addEventListener('change', renderGrid);
document.getElementById('sortSel').addEventListener('change', renderGrid);

const upWrap = document.getElementById('upWrap');
document.getElementById('shareBtn').addEventListener('click', () => {
  upWrap.classList.toggle('open');
  if (upWrap.classList.contains('open')) upWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});
document.getElementById('upCancel').addEventListener('click', () => upWrap.classList.remove('open'));
document.getElementById('dropZone').addEventListener('click', () => document.getElementById('upFile').click());
document.getElementById('upFile').addEventListener('change', function () {
  document.getElementById('upFileName').textContent = this.files[0] ? this.files[0].name : '';
});

document.getElementById('upGo').addEventListener('click', () => {
  const title = document.getElementById('upTitle').value.trim();
  const file = document.getElementById('upFile').files[0];
  if (!title) { toast('Give the paper a title first.', 'err'); return; }
  if (!file) { toast('Choose a PDF file first.', 'err'); return; }
  if (file.size > 20 * 1024 * 1024) { toast('That file is bigger than 20 MB.', 'err'); return; }
  const form = new FormData();
  form.append('file', file);
  form.append('title', title);
  form.append('subject', document.getElementById('upSubject').value.trim());
  form.append('description', document.getElementById('upDesc').value.trim());
  form.append('level', document.getElementById('upLevel').value);
  form.append('year', document.getElementById('upYear').value.trim());
  const barWrap = document.getElementById('upBar');
  const bar = barWrap.querySelector('i');
  barWrap.classList.add('show');
  bar.style.width = '0';
  const go = document.getElementById('upGo');
  go.disabled = true;
  go.textContent = 'Uploading 0%';
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/papers/public-upload');
  xhr.setRequestHeader('x-session-token', _token);
  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    const pct = Math.round(e.loaded / e.total * 100);
    bar.style.width = pct + '%';
    go.textContent = 'Uploading ' + pct + '%';
  };
  xhr.onload = () => {
    go.disabled = false;
    go.textContent = 'Upload Paper';
    barWrap.classList.remove('show');
    let d = {};
    try { d = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status >= 200 && xhr.status < 300 && !d.error) {
      toast('Paper shared to the library.', 'ok');
      document.getElementById('upTitle').value = '';
      document.getElementById('upSubject').value = '';
      document.getElementById('upDesc').value = '';
      document.getElementById('upYear').value = '';
      document.getElementById('upFile').value = '';
      document.getElementById('upFileName').textContent = '';
      upWrap.classList.remove('open');
      loadLibrary();
    } else {
      toast('Upload failed: ' + (d.error || ('server error ' + xhr.status)), 'err');
    }
  };
  xhr.onerror = () => {
    go.disabled = false;
    go.textContent = 'Upload Paper';
    barWrap.classList.remove('show');
    toast('Upload failed: network error.', 'err');
  };
  xhr.send(form);
});

loadLibrary();
</script>
</body>
</html>
