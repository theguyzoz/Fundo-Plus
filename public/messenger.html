<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <title>Messenger — Fundo Plus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --acc:#2563eb;--acc2:#1d4ed8;
      --green:#22c55e;--red:#ef4444;
      --surf:#fff;--bg:#f0f2f5;
      --msg-out:#d9fdd3;--msg-in:#fff;
      --border:#e5e7eb;--muted:#6b7280;--subtle:#9ca3af;--text:#111827;
      --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      --hh:58px;
    }
    html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text)}

    /* ── topbar ── */
    .topbar{
      height:var(--hh);background:#fff;border-bottom:1px solid var(--border);
      display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;
      box-shadow:0 1px 4px rgba(0,0,0,.06);
    }
    .topbar-logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:.95rem;color:var(--acc);text-decoration:none}
    .topbar-logo img{width:26px;height:26px;border-radius:6px}
    .topbar-title{font-size:1rem;font-weight:700}
    .topbar-right{margin-left:auto;display:flex;gap:6px;align-items:center}
    .ib{width:34px;height:34px;border-radius:50%;border:none;background:0;cursor:pointer;
        display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s}
    .ib:hover{background:var(--bg);color:var(--text)}
    .dash-link{font-size:.78rem;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:3px;font-weight:600;white-space:nowrap}
    .dash-link:hover{color:var(--acc)}

    /* ── layout ── */
    .msngr{display:flex;flex:1;height:calc(100vh - var(--hh));overflow:hidden}

    /* ── sidebar ── */
    .sidebar{
      width:320px;min-width:260px;display:flex;flex-direction:column;
      border-right:1px solid var(--border);background:#fff;overflow:hidden;flex-shrink:0;
    }
    .sb-head{padding:12px 14px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
    .sb-head h2{font-size:.9rem;font-weight:700;flex:1}
    .sb-search{padding:8px 12px;border-bottom:1px solid var(--border)}
    .sb-search input{
      width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:20px;
      font-size:.83rem;font-family:var(--font);outline:none;background:var(--bg);transition:border .15s
    }
    .sb-search input:focus{border-color:var(--acc)}
    .chat-list{flex:1;overflow-y:auto}
    .chat-list::-webkit-scrollbar{width:3px}
    .chat-list::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}

    .ci{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;
        border-bottom:1px solid #f3f4f6;transition:background .12s;user-select:none}
    .ci:hover{background:#f9fafb}
    .ci.active{background:#eff6ff}
    .ci-meta{flex:1;min-width:0}
    .ci-row{display:flex;align-items:baseline;gap:4px}
    .ci-name{font-weight:600;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
    .ci-time{font-size:.7rem;color:var(--subtle);white-space:nowrap;flex-shrink:0}
    .ci-prev{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
    .badge{background:var(--acc);color:#fff;border-radius:50px;font-size:.63rem;font-weight:700;
           padding:2px 6px;min-width:17px;text-align:center;flex-shrink:0}
    .empty-sb{padding:32px 20px;text-align:center;color:var(--muted);font-size:.8rem}
    .empty-sb svg{opacity:.2;display:block;margin:0 auto 10px}

    /* ── avatars ── */
    .av{border-radius:50%;display:flex;align-items:center;justify-content:center;
        font-weight:700;color:#fff;overflow:hidden;flex-shrink:0}
    .av-lg{width:44px;height:44px;font-size:.95rem}
    .av-md{width:36px;height:36px;font-size:.8rem}
    .av-sm{width:28px;height:28px;font-size:.68rem}
    .av img{width:100%;height:100%;object-fit:cover;border-radius:50%}

    /* ── chat area ── */
    .chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
    .ca-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
              color:var(--muted);gap:10px;text-align:center;padding:24px}
    .ca-empty svg{opacity:.2}
    .ca-empty h3{font-size:1rem;font-weight:600;color:var(--text)}
    .ca-empty p{font-size:.82rem;max-width:260px;line-height:1.5}

    /* bg */
    #chatBg{position:absolute;inset:0;z-index:0;background:#e5ddd5;
      background-image:url("data:image/svg+xml,%3Csvg width='52' height='52' viewBox='0 0 52 52' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23b8a898' fill-opacity='0.25'%3E%3Cpath d='M0 0h4v4H0zm8 0h4v4H8zm8 0h4v4h-4zm8 0h4v4h-4zm8 0h4v4h-4zm8 0h4v4h-4zm8 0h4v4h-4zM0 8h4v4H0zm8 0h4v4H8zm8 0h4v4h-4zm8 0h4v4h-4zm8 0h4v4h-4zm8 0h4v4h-4zm8 0h4v4h-4z'/%3E%3C/g%3E%3C/svg%3E")}
    #chatBg.bg-none{background:var(--bg);background-image:none}
    #chatBg.bg-custom{background-size:cover;background-position:center;background-image:none!important}

    .ch-head{
      height:var(--hh);background:#fff;border-bottom:1px solid var(--border);
      display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;
      z-index:2;position:relative;
    }
    .ch-info{flex:1;min-width:0}
    .ch-info .name{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ch-info .sub{font-size:.72rem;color:var(--muted)}
    #backBtn{display:none}

    /* messages */
    .msgs{flex:1;overflow-y:auto;padding:14px 5%;display:flex;flex-direction:column;
          gap:3px;position:relative;z-index:1}
    .msgs::-webkit-scrollbar{width:3px}
    .msgs::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:3px}

    .date-sep{text-align:center;margin:8px 0;font-size:.7rem;color:var(--muted)}
    .date-sep span{background:rgba(255,255,255,.85);border-radius:10px;padding:3px 9px;
                   display:inline-block;backdrop-filter:blur(4px)}

    .mr{display:flex;flex-direction:column;max-width:75%}
    .mr.out{align-self:flex-end;align-items:flex-end}
    .mr.in{align-self:flex-start;align-items:flex-start}
    .mr.sys{align-self:center;max-width:90%}

    .bubble{padding:7px 10px 4px;border-radius:10px;font-size:.87rem;line-height:1.45;
            position:relative;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.1)}
    .out .bubble{background:var(--msg-out);border-bottom-right-radius:2px}
    .in .bubble{background:var(--msg-in);border-bottom-left-radius:2px}
    .sys .bubble{background:rgba(255,255,255,.8);font-size:.72rem;color:var(--muted);
                 border-radius:10px;text-align:center;padding:3px 10px}

    .rp{border-left:3px solid var(--acc);padding:3px 7px;margin-bottom:5px;border-radius:3px;
        background:rgba(0,0,0,.05);font-size:.76rem;color:var(--muted);cursor:pointer}
    .rp .rn{font-weight:600;color:var(--acc);font-size:.74rem}

    .mf{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:2px}
    .mt{font-size:.64rem;color:var(--subtle)}
    .tick{font-size:.78rem;line-height:1}
    .tick.s{color:#94a3b8}.tick.d{color:#94a3b8}.tick.r{color:#3b82f6}

    /* input */
    .input-area{background:#f0f2f5;border-top:1px solid var(--border);padding:9px 10px;
                display:flex;flex-direction:column;gap:5px;z-index:2;position:relative;flex-shrink:0}
    .rply-bar{display:none;background:#fff;border-left:3px solid var(--acc);padding:5px 9px;
              border-radius:6px;font-size:.78rem;color:var(--muted);align-items:center;gap:7px}
    .rply-bar.show{display:flex}
    .rply-bar .rn{font-weight:600;color:var(--acc)}
    .rply-bar .rt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rply-bar button{background:0;border:none;cursor:pointer;color:var(--subtle);font-size:.9rem;padding:2px}
    .irow{display:flex;align-items:flex-end;gap:7px}
    .msg-ta{flex:1;border:none;outline:none;resize:none;border-radius:20px;background:#fff;
            padding:9px 14px;font-size:.875rem;font-family:var(--font);line-height:1.4;
            max-height:120px;overflow-y:auto;box-shadow:0 1px 2px rgba(0,0,0,.07)}
    .send-btn{width:40px;height:40px;border-radius:50%;background:var(--acc);border:none;
              cursor:pointer;display:flex;align-items:center;justify-content:center;
              color:#fff;transition:.15s;flex-shrink:0}
    .send-btn:hover{background:var(--acc2)}
    .send-btn:disabled{background:#c4c4c4;cursor:default}
    .blocked-bar{background:#fef2f2;border-top:1px solid #fecaca;padding:9px 14px;
                 font-size:.8rem;color:#b91c1c;text-align:center;display:none;flex-shrink:0;
                 z-index:2;position:relative}
    .blocked-bar.show{display:block}

    /* overlays */
    .ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
        display:none;align-items:center;justify-content:center;padding:16px}
    .ov.open{display:flex}
    .panel{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:400px;
           max-height:90vh;overflow-y:auto;position:relative}
    .panel h3{font-size:.95rem;font-weight:700;margin-bottom:14px}
    .pc{position:absolute;top:14px;right:14px;background:0;border:none;cursor:pointer;
        color:var(--muted);font-size:1.1rem;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%}
    .pc:hover{background:var(--bg)}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:.76rem;font-weight:600;margin-bottom:4px;color:var(--muted)}
    .field input,.field textarea,.field select{
      width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:8px;
      font-size:.85rem;font-family:var(--font);outline:none;transition:border .15s}
    .field input:focus,.field textarea:focus{border-color:var(--acc)}
    .field textarea{resize:vertical;min-height:55px}
    .tog-row{display:flex;align-items:center;gap:9px;margin-bottom:12px}
    .tog-row label{font-size:.84rem;flex:1}
    .tog{width:40px;height:22px;border-radius:11px;background:#d1d5db;position:relative;
         cursor:pointer;transition:.2s;border:none;flex-shrink:0}
    .tog.on{background:var(--acc)}
    .tog::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;
                border-radius:50%;background:#fff;transition:.2s}
    .tog.on::after{transform:translateX(18px)}
    .btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;
         font-size:.84rem;font-family:var(--font);transition:.15s}
    .btn-p{background:var(--acc);color:#fff}.btn-p:hover{background:var(--acc2)}
    .btn-g{background:0;color:var(--muted);border:1px solid var(--border)}.btn-g:hover{background:var(--bg)}
    .btn-d{background:var(--red);color:#fff}.btn-d:hover{background:#dc2626}
    .btn-sm{padding:5px 11px;font-size:.78rem}
    .btn-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}

    /* search results */
    .sr-item{display:flex;align-items:center;gap:9px;padding:9px;border-radius:8px;cursor:pointer;transition:.12s}
    .sr-item:hover{background:var(--bg)}
    .sr-item .sn{font-weight:600;font-size:.84rem}
    .sr-item .se{font-size:.73rem;color:var(--muted)}

    /* pic preview */
    .pprev{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;
           font-size:1.4rem;font-weight:700;color:#fff;margin:0 auto 12px;overflow:hidden;
           cursor:pointer;position:relative}
    .pprev img{width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;inset:0}
    .pprev .init{position:relative;z-index:1}

    .warn-box{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 11px;
              font-size:.77rem;color:#92400e;margin-top:5px;display:none}

    #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
           background:#1f2937;color:#fff;padding:9px 18px;border-radius:10px;
           font-size:.82rem;z-index:9999;opacity:0;pointer-events:none;
           transition:opacity .2s;white-space:nowrap;max-width:90vw;text-align:center}
    #toast.show{opacity:1}

    /* mobile */
    @media(max-width:660px){
      .sidebar{width:100%;max-width:100%}
      .chat-area{display:none}
      .sidebar.sb-hide{display:none}
      .chat-area.ca-show{display:flex;width:100%}
      #backBtn{display:flex}
    }
  </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <a class="topbar-logo" href="/~">
    <img src="/images/logo.png" alt="FP">
    <span>Fundo Plus</span>
  </a>
  <span class="topbar-title">Messenger</span>
  <div class="topbar-right">
    <button class="ib" id="btnNewChat" title="New chat">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="ib" id="btnSettings" title="Settings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
    <a class="dash-link" href="/~">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Dashboard
    </a>
  </div>
</div>

<div class="msngr">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="av av-sm" id="myAv" style="background:var(--acc)">?</div>
      <h2 id="myName">Loading…</h2>
    </div>
    <div class="sb-search"><input type="text" id="sbSearch" placeholder="Search conversations…"></div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- Chat area -->
  <div class="chat-area" id="chatArea">
    <div class="ca-empty" id="caEmpty">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <h3>Select a conversation</h3>
      <p>Choose from your inbox or tap + to start a new chat</p>
    </div>

    <div id="chatView" style="display:none;flex-direction:column;flex:1;overflow:hidden">
      <div class="ch-head">
        <button class="ib" id="backBtn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="av av-md" id="chAv" style="background:var(--acc)">?</div>
        <div class="ch-info">
          <div class="name" id="chName">–</div>
          <div class="sub" id="chSub"></div>
        </div>
        <button class="ib" id="btnMenu">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
      </div>

      <div id="chatBg"></div>
      <div class="msgs" id="msgs"></div>

      <div class="blocked-bar" id="blockedBar">
        You blocked this person.
        <button class="btn btn-sm btn-g" id="btnUnblock" style="margin-left:8px">Unblock</button>
      </div>

      <div class="input-area" id="inputArea">
        <div class="rply-bar" id="replyBar">
          <div style="flex:1;min-width:0">
            <div class="rn" id="rplyName"></div>
            <div class="rt" id="rplyText"></div>
          </div>
          <button id="btnClearReply">✕</button>
        </div>
        <div class="irow">
          <textarea class="msg-ta" id="msgTa" placeholder="Type a message…" rows="1"></textarea>
          <button class="send-btn" id="btnSend">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- New Chat overlay -->
<div class="ov" id="ovNewChat">
  <div class="panel">
    <button class="pc" id="btnCloseNewChat">✕</button>
    <h3>New Conversation</h3>
    <div class="field">
      <label>Search by name or enter email</label>
      <input type="text" id="ncSearch" placeholder="Name or email address…" autocomplete="off">
    </div>
    <div id="ncResults"></div>
    <div class="warn-box" id="ncWarn"></div>
  </div>
</div>

<!-- Settings overlay -->
<div class="ov" id="ovSettings">
  <div class="panel">
    <button class="pc" id="btnCloseSettings">✕</button>
    <h3>Settings</h3>
    <div class="pprev" id="pprev">
      <span class="init" id="pprevInit">?</span>
    </div>
    <div class="field">
      <label>Profile Picture URL</label>
      <input type="url" id="sPicUrl" placeholder="https://…">
    </div>
    <div class="field">
      <label>Username (shown instead of real name)</label>
      <input type="text" id="sUsername" maxlength="32" placeholder="e.g. StudyKing_Zim">
    </div>
    <div class="field">
      <label>Bio</label>
      <textarea id="sBio" maxlength="120" placeholder="Short bio…"></textarea>
    </div>
    <div class="tog-row">
      <label>Allow others to find me by search</label>
      <button class="tog" id="togPublic"></button>
    </div>
    <div class="field">
      <label>Chat background</label>
      <select id="sBgType">
        <option value="default">Default (pattern)</option>
        <option value="none">None (plain)</option>
        <option value="custom">Custom image URL</option>
      </select>
    </div>
    <div class="field" id="sBgUrlWrap" style="display:none">
      <label>Background image URL</label>
      <input type="url" id="sBgUrl" placeholder="https://…">
    </div>
    <div class="btn-row">
      <button class="btn btn-g" id="btnCancelSettings">Cancel</button>
      <button class="btn btn-p" id="btnSaveSettings">Save</button>
    </div>
  </div>
</div>

<!-- Chat menu overlay -->
<div class="ov" id="ovMenu">
  <div class="panel" style="max-width:280px">
    <button class="pc" id="btnCloseMenu">✕</button>
    <h3 id="menuTitle">Options</h3>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
      <button class="btn btn-g" id="btnBlockToggle">Block</button>
      <button class="btn btn-d" id="btnClearChat">Clear chat history</button>
      <button class="btn btn-g" id="btnCancelMenu">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
// ════════════════════════════════════════════
//  CONSTANTS
// ════════════════════════════════════════════
let TOKEN = null;
try { TOKEN = localStorage.getItem('fp_session'); } catch (e) { TOKEN = null; }
if (!TOKEN) { location.href = '/login'; }

const LS_KEY = 'fp_msngr_v3';
const AV_COLORS = ['#2563eb','#7c3aed','#db2777','#ea580c','#16a34a','#0891b2'];

// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
let me = null;        // { id, email, displayName, settings }
let inbox = {};       // { [uid]: Contact }
let activeId = null;  // current open chat uid
let replyTo = null;   // { msgId, name, text } | null
let drainTimer = null;
let ncDebounce = null;

// Contact shape: { id, displayName, profilePicUrl, email, messages:[], unread:0, blocked:false }

// ════════════════════════════════════════════
//  API
// ════════════════════════════════════════════
async function apiFetch(method, url, body) {
  const opts = { method, headers: { 'x-session-token': TOKEN } };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(url, opts);
  // Guard against non-JSON responses (HTML error pages, redirects, etc.)
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('application/json')) {
    return { ok: false, _status: r.status, error: `Unexpected response (${r.status})` };
  }
  const j = await r.json();
  j._status = r.status;
  return j;
}

// ════════════════════════════════════════════
//  PERSISTENCE
// ════════════════════════════════════════════
function loadInbox() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      for (const uid in parsed) {
        const c = parsed[uid];
        inbox[uid] = {
          id: uid,
          displayName: c.displayName || uid,
          profilePicUrl: c.profilePicUrl || '',
          email: c.email || '',
          messages: Array.isArray(c.messages) ? c.messages : [],
          unread: Number(c.unread) || 0,
          blocked: !!c.blocked,
        };
      }
    }
  } catch (e) { console.warn('inbox load', e); }
}

function saveInbox() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(inbox)); } catch(e) {}
}

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════
async function init() {
  loadInbox();
  renderChatList();

  let r;
  try {
    r = await apiFetch('GET', '/api/messenger/me');
  } catch(e) {
    // Network failure — clear loading state and show error
    document.getElementById('myAv').textContent = '!';
    document.getElementById('myName').textContent = 'Offline';
    showToast('Could not connect to server — check your connection');
    return;
  }

  // Not authenticated or server error
  if (!r || !r.ok) {
    if (r && (r._status === 401 || r._status === 403)) {
      location.href = '/login';
    } else {
      document.getElementById('myAv').textContent = '!';
      document.getElementById('myName').textContent = 'Error';
      showToast(r?.error || 'Failed to load — please refresh');
    }
    return;
  }

  me = { id: r.id, email: r.email, displayName: r.displayName, settings: r.settings || {} };

  // Render my avatar + name
  const avEl = document.getElementById('myAv');
  avEl.style.background = avatarColor(me.displayName);
  if (me.settings.profilePicUrl) {
    avEl.innerHTML = `<img src="${xe(me.settings.profilePicUrl)}" onerror="this.remove()"><span style="position:relative">${initials(me.displayName)}</span>`;
  } else {
    avEl.textContent = initials(me.displayName);
  }
  document.getElementById('myName').textContent = me.displayName;

  applyBg(me.settings);
  await drain();
  drainTimer = setInterval(drain, 25000);
}

// ════════════════════════════════════════════
//  DRAIN (fetch pending from server)
// ════════════════════════════════════════════
async function drain() {
  try {
    const r = await apiFetch('GET', '/api/messenger/drain');
    if (!r || !r.ok || !r.messages || !r.messages.length) return;

    // Collect unknown senders
    const senderIds = [...new Set(r.messages.map(m => m.from))];
    const unknownIds = senderIds.filter(id => !inbox[id]);
    if (unknownIds.length) {
      const info = await apiFetch('POST', '/api/messenger/user-info', { ids: unknownIds });
      if (info && info.ok && info.users) {
        info.users.forEach(u => {
          if (!inbox[u.id]) inbox[u.id] = mkContact(u);
        });
      }
    }

    let changed = false;
    r.messages.forEach(m => {
      if (!inbox[m.from]) inbox[m.from] = mkContact({ id: m.from, displayName: m.from, profilePicUrl: '', email: '' });
      const c = inbox[m.from];
      if (!c.messages.find(x => x.id === m.id)) {
        c.messages.push({ id: m.id, text: m.text, sentAt: m.sentAt, dir: 'in', status: 'read', replyTo: null });
        if (m.from !== activeId) c.unread = (c.unread || 0) + 1;
        changed = true;
      }
    });

    if (changed) {
      saveInbox();
      renderChatList();
      if (activeId && r.messages.some(m => m.from === activeId)) renderMsgs();
    }
  } catch(e) { console.warn('drain', e); }
}

// ════════════════════════════════════════════
//  CHAT LIST
// ════════════════════════════════════════════
function mkContact(u) {
  return { id: u.id, displayName: u.displayName || u.id, profilePicUrl: u.profilePicUrl || '', email: u.email || '', messages: [], unread: 0, blocked: false };
}

function renderChatList() {
  const el = document.getElementById('chatList');
  const q = (document.getElementById('sbSearch').value || '').toLowerCase();
  let contacts = Object.values(inbox);
  if (q) contacts = contacts.filter(c => (c.displayName||'').toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q));
  contacts.sort((a, b) => {
    const ta = a.messages[a.messages.length-1]?.sentAt || '';
    const tb = b.messages[b.messages.length-1]?.sentAt || '';
    return tb.localeCompare(ta);
  });

  if (!contacts.length) {
    el.innerHTML = `<div class="empty-sb"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>${q ? 'No results.' : 'No conversations yet.<br>Tap + to start one.'}</div>`;
    return;
  }

  el.innerHTML = contacts.map(c => {
    const last = c.messages[c.messages.length-1];
    const prev = last ? (last.dir==='out'?'✓ ':'')+last.text.slice(0,55) : 'Tap to chat';
    const t = last ? fmtTime(last.sentAt) : '';
    const badge = c.unread > 0 ? `<span class="badge">${c.unread>99?'99+':c.unread}</span>` : '';
    return `<div class="ci${activeId===c.id?' active':''}" data-uid="${xe(c.id)}">
      ${avHtml(c,'av av-lg')}
      <div class="ci-meta">
        <div class="ci-row"><span class="ci-name">${xe(c.displayName)}</span><span class="ci-time">${t}</span></div>
        <div class="ci-row" style="margin-top:2px"><span class="ci-prev">${xe(prev)}</span>${badge}</div>
      </div>
    </div>`;
  }).join('');

  // Bind click events safely
  el.querySelectorAll('.ci').forEach(el => {
    el.addEventListener('click', () => openChat(el.dataset.uid));
  });
}

// ════════════════════════════════════════════
//  OPEN CHAT
// ════════════════════════════════════════════
function openChat(uid) {
  const c = inbox[uid];
  if (!c) return;
  activeId = uid;
  c.unread = 0;
  saveInbox();
  renderChatList();

  // Header
  document.getElementById('chName').textContent = c.displayName;
  document.getElementById('chSub').textContent = c.email;
  const chAvEl = document.getElementById('chAv');
  chAvEl.style.background = avatarColor(c.displayName);
  chAvEl.innerHTML = avInner(c);

  // Blocked state
  refreshBlockedBar(c);

  // Show chat view
  document.getElementById('caEmpty').style.display = 'none';
  const cv = document.getElementById('chatView');
  cv.style.display = 'flex';

  renderMsgs();
  scrollBottom();

  // Mobile
  document.getElementById('sidebar').classList.add('sb-hide');
  document.getElementById('chatArea').classList.add('ca-show');

  clearReply();
  document.getElementById('msgTa').focus();
}

function refreshBlockedBar(c) {
  const bar = document.getElementById('blockedBar');
  const ia = document.getElementById('inputArea');
  if (c.blocked) { bar.classList.add('show'); ia.style.display='none'; }
  else { bar.classList.remove('show'); ia.style.display=''; }
}

// ════════════════════════════════════════════
//  RENDER MESSAGES
// ════════════════════════════════════════════
function renderMsgs() {
  const c = inbox[activeId];
  const el = document.getElementById('msgs');
  if (!c || !c.messages.length) {
    el.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:.78rem;margin-top:28px;opacity:.6">Say hello! 👋</div>';
    return;
  }
  let html = '';
  let lastDate = '';
  c.messages.forEach(msg => {
    const d = new Date(msg.sentAt);
    const ds = fmtDate(d);
    if (ds !== lastDate) { html += `<div class="date-sep"><span>${ds}</span></div>`; lastDate = ds; }
    html += bubbleHtml(msg, c);
  });
  el.innerHTML = html;
  scrollBottom();
}

function bubbleHtml(msg, c) {
  const isOut = msg.dir === 'out';
  const t = new Date(msg.sentAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  let tick = '';
  if (isOut) {
    const s = msg.status || 'sending';
    if (s==='sending') tick = `<span class="tick" title="Sending" style="color:#94a3b8">🕐</span>`;
    else if (s==='sent') tick = `<span class="tick s" title="Sent">✓</span>`;
    else if (s==='delivered') tick = `<span class="tick d" title="Delivered">✓✓</span>`;
    else if (s==='read') tick = `<span class="tick r" title="Read">✓✓</span>`;
  }
  let rp = '';
  if (msg.replyTo) {
    const orig = c.messages.find(m => m.id === msg.replyTo.msgId);
    rp = `<div class="rp" data-scroll="${xe(msg.replyTo.msgId)}"><div class="rn">${xe(msg.replyTo.name)}</div><div>${xe((orig?.text||msg.replyTo.text||'').slice(0,70))}</div></div>`;
  }
  return `<div class="mr ${isOut?'out':'in'}" id="m-${msg.id}" data-id="${msg.id}">
    <div class="bubble">${rp}${xe(msg.text)}<div class="mf"><span class="mt">${t}</span>${tick}</div></div>
  </div>`;
}

function scrollBottom() {
  const el = document.getElementById('msgs');
  el.scrollTop = el.scrollHeight;
}

// Reply on double-click
document.getElementById('msgs').addEventListener('dblclick', e => {
  const row = e.target.closest('.mr');
  if (!row || !activeId) return;
  const msgId = row.dataset.id;
  const c = inbox[activeId];
  const msg = c && c.messages.find(m => m.id === msgId);
  if (!msg) return;
  const name = msg.dir==='out' ? 'You' : c.displayName;
  replyTo = { msgId: msg.id, name, text: msg.text };
  document.getElementById('rplyName').textContent = name;
  document.getElementById('rplyText').textContent = msg.text.slice(0,60);
  document.getElementById('replyBar').classList.add('show');
  document.getElementById('msgTa').focus();
});

// Scroll to quoted msg
document.getElementById('msgs').addEventListener('click', e => {
  const rp = e.target.closest('.rp');
  if (!rp) return;
  const id = rp.dataset.scroll;
  const target = document.getElementById('m-'+id);
  if (target) target.scrollIntoView({ behavior:'smooth', block:'center' });
});

// ════════════════════════════════════════════
//  SEND
// ════════════════════════════════════════════
async function sendMsg() {
  const ta = document.getElementById('msgTa');
  const text = ta.value.trim();
  if (!text || !activeId) return;
  const c = inbox[activeId];
  if (!c) return;

  const clientId = 'cl-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
  const tempMsg = {
    id: clientId, text, sentAt: new Date().toISOString(),
    dir: 'out', status: 'sending',
    replyTo: replyTo ? { msgId: replyTo.msgId, name: replyTo.name, text: replyTo.text } : null,
  };

  c.messages.push(tempMsg);
  ta.value = '';
  ta.style.height = '';
  clearReply();
  renderMsgs();
  saveInbox();

  try {
    const r = await apiFetch('POST', '/api/messenger/send', { to: activeId, text, clientId });
    const idx = c.messages.findIndex(m => m.id === clientId);
    if (r && r.ok && idx !== -1) {
      c.messages[idx].id = r.message.id;
      c.messages[idx].status = 'sent';
    } else if (r && r.error === 'blocked') {
      if (idx !== -1) c.messages.splice(idx, 1);
      showToast('This user has blocked you.');
    } else {
      if (idx !== -1) c.messages[idx].status = 'sending';
      showToast(r && r.error ? r.error : 'Send failed');
    }
  } catch {
    const idx = c.messages.findIndex(m => m.id === clientId);
    if (idx !== -1) c.messages.splice(idx, 1);
    showToast('Network error — message not sent');
  }
  saveInbox();
  renderMsgs();
}

function clearReply() {
  replyTo = null;
  document.getElementById('replyBar').classList.remove('show');
}

// ════════════════════════════════════════════
//  NEW CHAT
// ════════════════════════════════════════════
function openNewChat() {
  document.getElementById('ncSearch').value = '';
  document.getElementById('ncResults').innerHTML = '';
  document.getElementById('ncWarn').style.display = 'none';
  openOv('ovNewChat');
  setTimeout(() => document.getElementById('ncSearch').focus(), 80);
}

async function runSearch() {
  const q = document.getElementById('ncSearch').value.trim();
  const warn = document.getElementById('ncWarn');
  const res = document.getElementById('ncResults');
  warn.style.display = 'none';
  if (!q) { res.innerHTML = ''; return; }

  // Email exact match
  if (q.includes('@') && q.includes('.')) {
    try {
      const r = await apiFetch('GET', `/api/messenger/user-by-email?email=${encodeURIComponent(q)}`);
      if (r && r.ok && r.user) { renderNCResults([r.user]); return; }
    } catch {}
  }

  // Name search
  try {
    const r = await apiFetch('GET', `/api/messenger/search?q=${encodeURIComponent(q)}`);
    if (r && r.ok) {
      if (!r.results.length) {
        res.innerHTML = '';
        warn.textContent = 'No users found. Try their exact email address to find them directly.';
        warn.style.display = 'block';
      } else {
        renderNCResults(r.results);
      }
    }
  } catch(e) { showToast('Search failed'); }
}

function renderNCResults(users) {
  const el = document.getElementById('ncResults');
  el.innerHTML = '';
  users.forEach(u => {
    const item = document.createElement('div');
    item.className = 'sr-item';
    item.innerHTML = `${avHtml(u,'av av-md')}<div><div class="sn">${xe(u.displayName)}</div><div class="se">${xe(u.email)}</div></div>`;
    item.addEventListener('click', () => startChatWith(u));
    el.appendChild(item);
  });
}

function startChatWith(user) {
  if (!inbox[user.id]) inbox[user.id] = mkContact(user);
  closeOv('ovNewChat');
  openChat(user.id);
}

// ════════════════════════════════════════════
//  BLOCK / UNBLOCK
// ════════════════════════════════════════════
async function toggleBlock() {
  if (!activeId) return;
  const c = inbox[activeId];
  const action = c.blocked ? 'unblock' : 'block';
  await apiFetch('POST', `/api/messenger/${action}/${activeId}`);
  c.blocked = !c.blocked;
  saveInbox();
  refreshBlockedBar(c);
  closeOv('ovMenu');
  showToast(c.blocked ? 'User blocked' : 'User unblocked');
}

async function unblockUser() {
  if (!activeId) return;
  const c = inbox[activeId];
  await apiFetch('POST', `/api/messenger/unblock/${activeId}`);
  c.blocked = false;
  saveInbox();
  refreshBlockedBar(c);
  showToast('User unblocked');
}

function clearChat() {
  if (!activeId) return;
  if (!confirm('Clear chat history on this device?')) return;
  inbox[activeId].messages = [];
  saveInbox();
  renderMsgs();
  closeOv('ovMenu');
  showToast('Chat cleared');
}

// ════════════════════════════════════════════
//  SETTINGS
// ════════════════════════════════════════════
function openSettings() {
  if (!me) return;
  const s = me.settings || {};
  document.getElementById('sPicUrl').value = s.profilePicUrl || '';
  document.getElementById('sUsername').value = s.username || '';
  document.getElementById('sBio').value = s.bio || '';
  document.getElementById('sBgType').value = s.bgType || 'default';
  document.getElementById('sBgUrl').value = s.bgUrl || '';
  document.getElementById('sBgUrlWrap').style.display = s.bgType==='custom' ? '' : 'none';
  setTog('togPublic', !!s.profilePublic);
  refreshPicPreview(s.profilePicUrl || '');
  openOv('ovSettings');
}

function refreshPicPreview(url) {
  const el = document.getElementById('pprev');
  const initEl = document.getElementById('pprevInit');
  const label = (me && me.displayName) ? me.displayName : '?';
  el.style.background = avatarColor(label);
  initEl.textContent = initials(label);
  // remove old img
  const old = el.querySelector('img');
  if (old) old.remove();
  if (url) {
    const img = document.createElement('img');
    img.src = url;
    img.onerror = () => img.remove();
    el.appendChild(img);
  }
}

async function saveSettings() {
  const bgType = document.getElementById('sBgType').value;
  const patch = {
    username: document.getElementById('sUsername').value.trim(),
    bio: document.getElementById('sBio').value.trim(),
    profilePicUrl: document.getElementById('sPicUrl').value.trim(),
    profilePublic: isTog('togPublic'),
    bgType,
    bgUrl: document.getElementById('sBgUrl').value.trim(),
  };
  try {
    const r = await apiFetch('PATCH', '/api/messenger/settings', patch);
    if (r && r.ok) {
      me.settings = r.settings;
      me.displayName = r.settings.username || me.displayName;
      document.getElementById('myName').textContent = me.displayName;
      applyBg(r.settings);
      closeOv('ovSettings');
      showToast('Settings saved');
    } else { showToast('Could not save'); }
  } catch { showToast('Network error'); }
}

// ════════════════════════════════════════════
//  BACKGROUND
// ════════════════════════════════════════════
function applyBg(settings) {
  const bg = document.getElementById('chatBg');
  if (!bg) return;
  const type = (settings && settings.bgType) || 'default';
  bg.className = '';
  bg.id = 'chatBg';
  bg.style.backgroundImage = '';
  if (type === 'none') {
    bg.classList.add('bg-none');
  } else if (type === 'custom' && settings && settings.bgUrl) {
    bg.classList.add('bg-custom');
    bg.style.backgroundImage = `url('${settings.bgUrl.replace(/'/g,"\\'")}')`;
  }
}

// ════════════════════════════════════════════
//  OVERLAY HELPERS
// ════════════════════════════════════════════
function openOv(id) { document.getElementById(id).classList.add('open'); }
function closeOv(id) { document.getElementById(id).classList.remove('open'); }

// ════════════════════════════════════════════
//  TOGGLE HELPERS
// ════════════════════════════════════════════
function setTog(id, on) { document.getElementById(id).classList.toggle('on', on); }
function isTog(id) { return document.getElementById(id).classList.contains('on'); }

// ════════════════════════════════════════════
//  AVATAR / UTIL
// ════════════════════════════════════════════
function initials(name) {
  const p = (name||'?').trim().split(/\s+/);
  return ((p[0]||'?')[0] + ((p[1]||'')[0]||'')).toUpperCase();
}
function avatarColor(name) {
  const code = (name||'A').charCodeAt(0);
  return AV_COLORS[code % AV_COLORS.length];
}
function avInner(c) {
  if (c.profilePicUrl) return `<img src="${xe(c.profilePicUrl)}" onerror="this.remove()">${initials(c.displayName)}`;
  return initials(c.displayName);
}
function avHtml(c, cls) {
  const col = avatarColor(c.displayName||c.id||'');
  const inner = c.profilePicUrl
    ? `<img src="${xe(c.profilePicUrl)}" onerror="this.remove()" style="position:absolute;inset:0">${initials(c.displayName||'?')}`
    : initials(c.displayName||'?');
  return `<div class="${cls}" style="background:${col};position:relative">${inner}</div>`;
}

function xe(s) {
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  if (d.toDateString()===now.toDateString()) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const diff=(now-d)/86400000;
  if (diff<7) return d.toLocaleDateString([],{weekday:'short'});
  return d.toLocaleDateString([],{day:'2-digit',month:'2-digit'});
}
function fmtDate(d) {
  const now=new Date(), yest=new Date(now); yest.setDate(now.getDate()-1);
  if (d.toDateString()===now.toDateString()) return 'Today';
  if (d.toDateString()===yest.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'});
}
function showToast(msg, ms=3000) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), ms);
}
function autoResize(ta) {
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,120)+'px';
}

  ncDebounce = setTimeout(runSearch, 380);
});

// Close overlays on backdrop click
document.querySelectorAll('.ov').forEach(ov => {
  ov.addEventListener('click', e => { if (e.target===ov) ov.classList.remove('open'); });
});
