<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <title>Messenger — Fundo Plus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --fp:#2952e3;--fp2:#1a3bb5;--fp-light:#eff4ff;
      --surf:#ffffff;--bg:#f1f3f9;--border:#e2e6f0;
      --muted:#6b7a99;--text:#0d1b3e;--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      --hh:56px;
    }
    html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text)}
    
    .topbar{height:var(--hh);background:var(--surf);border-bottom:1px solid var(--border);
      display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
    .topbar-logo{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--fp);text-decoration:none}
    .topbar-logo img{width:26px;height:26px;border-radius:7px}
    
    .msngr{display:flex;flex:1;height:calc(100vh - var(--hh));overflow:hidden}
    
    .sidebar{width:300px;min-width:260px;border-right:1px solid var(--border);background:var(--surf);display:flex;flex-direction:column}
    .sb-head{padding:16px;display:flex;align-items:center;gap:12px}
    .sb-me-name{font-weight:700}
    
    .chat-list{flex:1;overflow-y:auto}
    .empty{padding:40px 20px;text-align:center;color:var(--muted)}
    
    .chat-area{flex:1;display:flex;flex-direction:column}
    .ch-head{height:var(--hh);background:var(--surf);border-bottom:1px solid var(--border);
      display:flex;align-items:center;padding:0 16px;gap:12px}
    
    .msgs{flex:1;overflow-y:auto;padding:16px}
    
    .input-area{background:#eef1f8;border-top:1px solid var(--border);padding:12px;display:flex;gap:8px}
    .msg-ta{flex:1;border:1px solid var(--border);border-radius:20px;padding:10px 16px;resize:none;font-family:inherit}
    .send-btn{width:44px;height:44px;border-radius:50%;background:var(--fp);color:white;border:none;cursor:pointer}
    
    .loading{text-align:center;padding:60px;color:var(--muted)}
    .error{text-align:center;padding:60px;color:#dc2626}
  </style>
</head>
<body>

<div class="topbar">
  <a class="topbar-logo" href="/~">
    <img src="/images/logo.png" alt="FP">
    <span>Fundo Plus</span>
  </a>
  <div style="margin-left:auto">
    <a href="/~" style="text-decoration:none;color:var(--muted)">Dashboard</a>
  </div>
</div>

<div class="msngr">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sb-head">
      <div class="av" id="myAv" style="width:40px;height:40px;border-radius:50%;background:#2952e3;color:white;display:flex;align-items:center;justify-content:center;font-weight:700">?</div>
      <div>
        <div class="sb-me-name" id="myName">Loading...</div>
        <div style="font-size:0.75rem;color:var(--muted)" id="myBio"></div>
      </div>
    </div>
    
    <div class="chat-list" id="chatList">
      <div class="loading">Loading conversations...</div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <div class="ch-head">
      <div id="chName" style="font-weight:700">Select a conversation</div>
    </div>
    
    <div class="msgs" id="msgs">
      <div class="empty">
        <div style="font-size:3rem;margin-bottom:12px">💬</div>
        <p>Select a conversation from the sidebar</p>
      </div>
    </div>
    
    <div class="input-area" id="inputArea" style="display:none">
      <textarea class="msg-ta" id="msgTa" placeholder="Type a message..." rows="1"></textarea>
      <button class="send-btn" id="btnSend">↑</button>
    </div>
  </div>
</div>

<script>
'use strict';

let TOKEN = localStorage.getItem('fp_session') || null;
let me = null;
let inbox = {};
let activeId = null;

async function api(method, url, body) {
  const opts = { 
    method, 
    headers: {}, 
    credentials: 'include' 
  };
  
  if (TOKEN) opts.headers['x-session-token'] = TOKEN;
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }

  const res = await fetch(url, opts);
  if (res.status === 401 || res.status === 403) {
    window.location.href = '/login?redirect=/messenger';
    return { ok: false };
  }
  
  const data = await res.json().catch(() => ({}));
  return data;
}

async function init() {
  console.log('[Messenger] Starting simplified version');

  const r = await api('GET', '/api/messenger/me');
  
  if (!r || !r.ok) {
    document.getElementById('myName').innerHTML = 'Please log in';
    document.getElementById('chatList').innerHTML = `
      <div style="padding:40px 20px;text-align:center">
        <div style="font-size:2rem;margin-bottom:12px">🔒</div>
        <p>You need to be logged in to use Messenger.</p>
        <a href="/login?redirect=/messenger" 
           style="display:inline-block;margin-top:16px;padding:10px 24px;background:#2952e3;color:white;border-radius:10px;text-decoration:none">
          Log in →
        </a>
      </div>`;
    return;
  }

  me = r;
  renderProfile();
  
  // Load conversations (simplified)
  await loadConversations();
  
  // Setup send button
  document.getElementById('btnSend').onclick = sendMessage;
}

function renderProfile() {
  document.getElementById('myName').textContent = me.displayName || me.email;
  document.getElementById('myBio').textContent = me.email || '';
  
  const av = document.getElementById('myAv');
  av.style.background = '#2952e3';
  av.textContent = (me.displayName || 'U')[0].toUpperCase();
}

async function loadConversations() {
  const el = document.getElementById('chatList');
  el.innerHTML = `<div class="loading">Loading conversations...</div>`;
  
  // For now, show empty state (we can expand later)
  el.innerHTML = `
    <div style="padding:40px 20px;text-align:center;color:#6b7a99">
      <div style="font-size:2.5rem;margin-bottom:12px">💬</div>
      <p>No conversations yet.</p>
      <p style="font-size:0.85rem;margin-top:8px">Start chatting with classmates</p>
    </div>`;
}

async function sendMessage() {
  alert('Messaging will be enabled in the next update.');
}

init().catch(err => {
  console.error('[Messenger] Init error:', err);
  document.getElementById('chatList').innerHTML = `
    <div style="padding:40px;text-align:center;color:#dc2626">
      Failed to load messenger.<br>
      <button onclick="location.reload()" style="margin-top:16px">Retry</button>
    </div>`;
});
</script>
</body>
</html>
