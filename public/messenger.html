<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <title>Messenger — Fundo Plus</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--fp:#2952e3;--bubble-out:#d9fdd3;--bubble-in:#fff;--surf:#fff;--bg:#f1f3f9;--border:#e2e6f0;--muted:#6b7a99;--text:#0d1b3e}
    html,body{height:100%;font-family:'Inter',system-ui;background:var(--bg);color:var(--text);overflow:hidden}
    .topbar{height:56px;background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px}
    .msngr{display:flex;flex:1;height:calc(100vh - 56px);overflow:hidden}
    .sidebar{width:300px;border-right:1px solid var(--border);background:var(--surf);display:flex;flex-direction:column;flex-shrink:0}
    .sb-head{padding:14px 16px;display:flex;align-items:center;gap:12px}
    .chat-list{flex:1;overflow-y:auto}
    .ci{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #f4f6fb}
    .ci:hover{background:#f8f9fd}
    .chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
    .ch-head{height:56px;background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:12px}
    .msgs{flex:1;overflow-y:auto;padding:12px 4%;display:flex;flex-direction:column;gap:4px}
    .mr{display:flex;flex-direction:column;max-width:78%}
    .mr.out{align-self:flex-end;align-items:flex-end}
    .mr.in{align-self:flex-start;align-items:flex-start}
    .bubble{padding:8px 14px;border-radius:18px;font-size:0.92rem;line-height:1.4}
    .out .bubble{background:var(--bubble-out);border-bottom-right-radius:4px}
    .in .bubble{background:var(--bubble-in);border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,0.06)}
    .mf{display:flex;align-items:center;gap:6px;margin-top:3px}
    .mt{font-size:0.65rem;color:#94a3b8}
    .tick{font-size:0.75rem;color:#94a3b8}
    .tick.read{color:#3b82f6}
    .input-area{background:#eef1f8;border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;flex-shrink:0}
    .msg-ta{flex:1;border:none;outline:none;resize:none;border-radius:20px;background:white;padding:10px 16px}
    .send-btn{width:42px;height:42px;border-radius:50%;background:#2952e3;color:white;border:none}
    .empty{text-align:center;padding:60px 20px;color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;z-index:200}
    .modal.open{display:flex}
    .modal-content{background:white;border-radius:16px;width:92%;max-width:420px}
    .ctx-menu{position:fixed;background:white;border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.12);z-index:300;min-width:160px;display:none}
    .ctx-item{padding:10px 16px;font-size:0.9rem;cursor:pointer}
    .ctx-item.danger{color:#dc2626}
    .online-dot{width:10px;height:10px;background:#22c55e;border-radius:50%;display:inline-block;margin-left:6px}
    @media(max-width:680px){.sidebar{width:100%;position:absolute;z-index:10}.chat-area{display:none;position:absolute;inset:0;z-index:20;background:white}.chat-area.active{display:flex}.sidebar.active{display:none}}
  </style>
</head>
<body>

<div class="topbar">
  <a href="/~" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#2952e3;font-weight:800">
    <img src="/images/logo.png" width="26" height="26" style="border-radius:7px"> Fundo Plus
  </a>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button onclick="openNewChat()" style="width:34px;height:34px;border-radius:50%;background:#2952e3;color:white;border:none;font-size:20px">+</button>
    <button onclick="openSettings()" style="width:34px;height:34px;border-radius:50%;background:#64748b;color:white;border:none">⚙</button>
  </div>
</div>

<div class="msngr">
  <div class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="av" id="myAv" style="width:42px;height:42px;border-radius:50%;background:#2952e3;color:white;display:flex;align-items:center;justify-content:center;font-weight:700">?</div>
      <div style="flex:1;min-width:0">
        <div class="sb-me-name" id="myName">Loading...</div>
        <div class="sb-me-email" id="myBio"></div>
      </div>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="ch-head">
      <button onclick="backToList()" id="backBtn" style="background:none;border:none;font-size:1.5rem;color:#64748b;display:none">←</button>
      <div style="flex:1">
        <div class="ch-name" id="chName">Select a chat</div>
        <div style="font-size:0.75rem;color:var(--muted)" id="chStatus"></div>
      </div>
      <button onclick="openChatMenu()" style="background:none;border:none;font-size:1.4rem;color:#64748b">⋮</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="input-area" id="inputArea" style="display:none">
      <textarea class="msg-ta" id="msgTa" placeholder="Type a message..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
      <button class="send-btn" onclick="sendMessage()">↑</button>
    </div>
  </div>
</div>

<!-- New Chat Modal -->
<div class="modal" id="modalNewChat">
  <div class="modal-content">
    <div style="padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <strong>New Chat</strong>
      <button onclick="closeModal('modalNewChat')" style="background:none;border:none;font-size:1.6rem">×</button>
    </div>
    <div style="padding:16px">
      <input type="text" id="searchInput" placeholder="Search name or email..." style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:12px" oninput="searchUsers()">
      <div id="searchResults"></div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal" id="modalSettings">
  <div class="modal-content">
    <div style="padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <strong>Settings</strong>
      <button onclick="closeModal('modalSettings')" style="background:none;border:none;font-size:1.6rem">×</button>
    </div>
    <div style="padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0">
        <div>
          <div style="font-weight:600">Public profile</div>
          <div style="font-size:0.8rem;color:var(--muted)">Allow others to find you by name</div>
        </div>
        <div class="toggle" id="togglePublic" onclick="togglePublic()"></div>
      </div>
    </div>
  </div>
</div>

<!-- Message Context Menu -->
<div class="ctx-menu" id="msgMenu">
  <div class="ctx-item" onclick="deleteMessage()">Delete Message</div>
</div>

<!-- Chat Context Menu -->
<div class="ctx-menu" id="chatMenu">
  <div class="ctx-item" onclick="editContact()">Edit Contact</div>
  <div class="ctx-item" onclick="deleteContact()">Delete Contact</div>
  <div class="ctx-item danger" onclick="toggleBlock()">Block / Unblock</div>
</div>

<script>
'use strict';

let TOKEN = localStorage.getItem('fp_session') || null;
let me = null;
let inbox = JSON.parse(localStorage.getItem('fp_msngr_inbox') || '{}');
let activeId = null;
let socket = null;

function saveInbox() {
  localStorage.setItem('fp_msngr_inbox', JSON.stringify(inbox));
}

async function api(method, url, body) {
  const opts = { method, headers: {}, credentials: 'include' };
  if (TOKEN) opts.headers['x-session-token'] = TOKEN;
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  if (res.status === 401 || res.status === 403) {
    window.location.href = '/login?redirect=/messenger';
    return { ok: false };
  }
  return await res.json().catch(() => ({}));
}

async function init() {
  const r = await api('GET', '/api/messenger/me');
  if (!r || !r.ok) {
    document.getElementById('myName').innerHTML = 'Please log in';
    return;
  }
  me = r;
  renderMyProfile();
  renderChatList();

  // Connect socket
  initSocket();

  // Drain pending messages on startup
  await drainPendingMessages();

  // Auto open first chat if exists
  const first = Object.keys(inbox)[0];
  if (first) openChat(first);

  // Poll for new messages every 15 seconds
  setInterval(drainPendingMessages, 15000);
}

function initSocket() {
  if (typeof io === 'undefined') {
    const s = document.createElement('script');
    s.src = 'https://cdn.socket.io/4.7.5/socket.io.min.js';
    s.onload = () => connectSocket();
    document.head.appendChild(s);
  } else {
    connectSocket();
  }
}

function connectSocket() {
  if (!me || socket) return;
  socket = io({ transports: ['websocket'] });
  socket.on('connect', () => {
    socket.emit('messenger:join', me.id);
  });
  socket.on('messenger:new-message', (msg) => {
    if (!msg || !msg.from) return;
    if (!inbox[msg.from]) {
      inbox[msg.from] = { id: msg.from, displayName: msg.from, email: '', messages: [] };
    }
    const c = inbox[msg.from];
    if (!c.messages) c.messages = [];
    if (!c.messages.find(m => m.id === msg.id)) {
      c.messages.push({ id: msg.id, text: msg.text, sentAt: msg.sentAt, dir: 'in', status: 'read' });
      saveInbox();
      renderChatList();
      if (activeId === msg.from) renderMessages();
    }
  });
}

// Pull pending messages from server
async function drainPendingMessages() {
  try {
    const r = await api('GET', '/api/messenger/drain');
    if (r.ok && r.messages && r.messages.length > 0) {
      let changed = false;
      r.messages.forEach(m => {
        if (!inbox[m.from]) {
          inbox[m.from] = { id: m.from, displayName: m.from, email: '', messages: [] };
        }
        const c = inbox[m.from];
        if (!c.messages) c.messages = [];
        if (!c.messages.find(x => x.id === m.id)) {
          c.messages.push({
            id: m.id,
            text: m.text,
            sentAt: m.sentAt,
            dir: 'in',
            status: 'read'
          });
          changed = true;
        }
      });
      if (changed) {
        saveInbox();
        renderChatList();
        if (activeId) renderMessages();
      }
    }
  } catch (e) {
    console.log('[Messenger] Drain failed (will retry)');
  }
}

function renderMyProfile() {
  document.getElementById('myName').textContent = me.displayName || me.email;
  document.getElementById('myBio').textContent = me.email || '';
  const av = document.getElementById('myAv');
  av.style.background = '#2952e3';
  av.textContent = (me.displayName || 'U')[0].toUpperCase();
}

function renderChatList() {
  const el = document.getElementById('chatList');
  const contacts = Object.values(inbox);
  if (!contacts.length) {
    el.innerHTML = `<div class="empty"><div style="font-size:2.5rem;margin-bottom:8px">💬</div>No conversations yet.<br>Tap + to start.</div>`;
    return;
  }
  el.innerHTML = contacts.map(c => {
    const last = c.messages && c.messages.length ? c.messages[c.messages.length-1] : null;
    const prev = last ? last.text.slice(0, 35) : 'Tap to chat';
    const online = c.online ? `<span class="online-dot"></span>` : '';
    return `
      <div class="ci ${activeId === c.id ? 'active' : ''}" onclick="openChat('${c.id}')" oncontextmenu="showContactMenu(event, '${c.id}')">
        <div class="user-avatar" style="width:42px;height:42px">${(c.displayName || 'U')[0]}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px">
            <span class="ci-name">${c.displayName}</span>
            ${online}
          </div>
          <div class="ci-prev">${prev}</div>
        </div>
      </div>`;
  }).join('');
}

function openChat(id) {
  activeId = id;
  const c = inbox[id];
  if (!c) return;
  
  document.getElementById('chName').textContent = c.displayName;
  document.getElementById('chStatus').textContent = c.email || '';
  document.getElementById('inputArea').style.display = 'flex';
  document.getElementById('chatArea').classList.add('active');
  document.getElementById('sidebar').classList.remove('active');
  
  renderMessages();
  renderChatList();
}

function renderMessages() {
  const el = document.getElementById('msgs');
  const c = inbox[activeId];
  if (!c || !c.messages || !c.messages.length) {
    el.innerHTML = `<div class="empty">Say hello 👋</div>`;
    return;
  }
  el.innerHTML = c.messages.map((m, index) => {
    const isOut = m.dir === 'out';
    let ticks = '';
    if (isOut) {
      if (m.status === 'read') ticks = `<span class="tick read">✓✓</span>`;
      else if (m.status === 'sent') ticks = `<span class="tick">✓</span>`;
      else ticks = `<span class="tick">⏱</span>`;
    }
    return `
      <div class="mr ${isOut ? 'out' : 'in'}" data-index="${index}" oncontextmenu="showMsgMenu(event, ${index})">
        <div class="bubble">${m.text}
          <div class="mf">
            <span class="mt">${new Date(m.sentAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
            ${ticks}
          </div>
        </div>
      </div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

async function sendMessage() {
  if (!activeId) return;
  const ta = document.getElementById('msgTa');
  const text = ta.value.trim();
  if (!text) return;

  const c = inbox[activeId];
  if (!c.messages) c.messages = [];
  
  const tempMsg = {
    id: 'local-' + Date.now(),
    text,
    sentAt: new Date().toISOString(),
    dir: 'out',
    status: 'sending'
  };
  
  c.messages.push(tempMsg);
  saveInbox();
  renderMessages();
  ta.value = '';

  const r = await api('POST', '/api/messenger/send', { to: activeId, text });
  if (r.ok) {
    const idx = c.messages.findIndex(m => m.id === tempMsg.id);
    if (idx !== -1) {
      c.messages[idx].id = r.message?.id || tempMsg.id;
      c.messages[idx].status = 'sent';
    }
  } else {
    const idx = c.messages.findIndex(m => m.id === tempMsg.id);
    if (idx !== -1) c.messages[idx].status = 'failed';
    alert('Failed to send message: ' + (r.error || 'Unknown error'));
  }
  saveInbox();
  renderMessages();
}

function showMsgMenu(e, index) {
  e.preventDefault();
  const menu = document.getElementById('msgMenu');
  menu.style.display = 'block';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.dataset.index = index;

  document.onclick = () => {
    menu.style.display = 'none';
    document.onclick = null;
  };
}

function deleteMessage() {
  const menu = document.getElementById('msgMenu');
  const index = parseInt(menu.dataset.index);
  const c = inbox[activeId];
  if (!c || !c.messages) return;

  c.messages.splice(index, 1);
  saveInbox();
  renderMessages();
  menu.style.display = 'none';
}

function showContactMenu(e, id) {
  e.preventDefault();
  const menu = document.getElementById('chatMenu');
  menu.style.display = 'block';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.dataset.id = id;

  document.onclick = () => {
    menu.style.display = 'none';
    document.onclick = null;
  };
}

function editContact() {
  const menu = document.getElementById('chatMenu');
  const id = menu.dataset.id;
  const c = inbox[id];
  if (!c) return;
  menu.style.display = 'none';

  const newName = prompt('Edit contact name:', c.displayName);
  if (newName && newName.trim()) {
    c.displayName = newName.trim();
    saveInbox();
    renderChatList();
    if (activeId === id) document.getElementById('chName').textContent = c.displayName;
  }
}

function deleteContact() {
  const menu = document.getElementById('chatMenu');
  const id = menu.dataset.id;
  if (!confirm('Delete this contact?')) return;
  menu.style.display = 'none';
  delete inbox[id];
  saveInbox();
  renderChatList();
  if (activeId === id) {
    activeId = null;
    document.getElementById('chatArea').classList.remove('active');
  }
}

async function toggleBlock() {
  const menu = document.getElementById('chatMenu');
  const id = menu.dataset.id;
  menu.style.display = 'none';
  const c = inbox[id];
  if (!c) return;

  const action = c.blocked ? 'unblock' : 'block';
  const r = await api('POST', `/api/messenger/${action}/${id}`);
  if (r.ok) {
    c.blocked = !c.blocked;
    saveInbox();
    alert(c.blocked ? 'User blocked' : 'User unblocked');
  }
}

function openNewChat() {
  document.getElementById('modalNewChat').classList.add('open');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
  searchUsers();
  document.getElementById('searchInput').oninput = () => searchUsers();
}

async function searchUsers() {
  const q = document.getElementById('searchInput').value.trim();
  const container = document.getElementById('searchResults');
  container.innerHTML = `<div style="padding:20px;text-align:center">Searching...</div>`;
  
  let results = [];
  try {
    if (q.includes('@')) {
      const r = await api('GET', `/api/messenger/user-by-email?email=${encodeURIComponent(q)}`);
      if (r.ok && r.user) results = [r.user];
    } else {
      const r = await api('GET', `/api/messenger/search?q=${encodeURIComponent(q)}`);
      if (r.ok) results = r.results || [];
    }
  } catch(e) {}
  
  if (!results.length) {
    container.innerHTML = `<div style="padding:20px;text-align:center;color:#888">No users found</div>`;
    return;
  }
  
  container.innerHTML = results.map(u => `
    <div class="user-item" onclick="startChat('${u.id}', '${u.displayName}', '${u.email}')">
      <div class="user-avatar">${(u.displayName || 'U')[0]}</div>
      <div>
        <div style="font-weight:600">${u.displayName}</div>
        <div style="font-size:0.8rem;color:#64748b">${u.email}</div>
      </div>
    </div>
  `).join('');
}

function startChat(id, name, email) {
  closeModal('modalNewChat');
  
  // Always ensure contact exists in inbox
  if (!inbox[id]) {
    inbox[id] = { 
      id, 
      displayName: name, 
      email: email || '', 
      messages: [], 
      unread: 0 
    };
    saveInbox();
    renderChatList();
  }
  
  openChat(id);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

async function openSettings() {
  document.getElementById('modalSettings').classList.add('open');
  try {
    const r = await api('GET', '/api/messenger/settings');
    const isPublic = r.ok && r.settings ? r.settings.profilePublic !== false : true;
    const tog = document.getElementById('togglePublic');
    tog.classList.toggle('on', isPublic);
    tog.dataset.value = isPublic;
  } catch(e) {}
}

async function togglePublic() {
  const tog = document.getElementById('togglePublic');
  const current = tog.dataset.value === 'true';
  const newVal = !current;
  tog.classList.toggle('on', newVal);
  tog.dataset.value = newVal;
  try {
    await api('PATCH', '/api/messenger/settings', { profilePublic: newVal });
  } catch(e) {
    alert('Failed to save');
  }
}

function backToList() {
  document.getElementById('chatArea').classList.remove('active');
  document.getElementById('sidebar').classList.add('active');
  activeId = null;
  renderChatList();
}

function checkMobile() {
  const backBtn = document.getElementById('backBtn');
  backBtn.style.display = window.innerWidth <= 680 ? 'block' : 'none';
}
window.addEventListener('resize', checkMobile);
checkMobile();

init();
</script>
</body>
</html>
