<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <title>Messenger — Fundo Plus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & tokens ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --acc: #2563eb; --acc2: #1d4ed8; --acc-light: #eff6ff;
      --green: #22c55e; --green2: #16a34a;
      --red: #ef4444; --red2: #dc2626;
      --surface: #fff; --bg: #f0f2f5;
      --side-bg: #fff; --side-hover: #f0f2f5;
      --msg-out: #dcf8c6; --msg-in: #fff;
      --border: #e5e7eb; --muted: #6b7280; --subtle: #9ca3af;
      --text: #111827;
      --radius: 12px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
      --header-h: 60px;
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

    /* ── Top bar ── */
    .topbar {
      height: var(--header-h); background: #fff; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
      flex-shrink: 0; z-index: 10; box-shadow: var(--shadow);
    }
    .topbar-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1rem; color: var(--acc); text-decoration: none; }
    .topbar-logo img { width: 28px; height: 28px; border-radius: 6px; }
    .topbar-title { font-size: 1.05rem; font-weight: 700; color: var(--text); }
    .topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none; background: 0;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--muted); transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--bg); color: var(--text); }
    .back-btn { display: none; }

    /* ── Layout ── */
    .messenger {
      display: flex; flex: 1; overflow: hidden; height: calc(100vh - var(--header-h));
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 340px; min-width: 280px; max-width: 400px;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border); background: var(--side-bg);
      overflow: hidden; flex-shrink: 0;
    }
    .sidebar-header {
      padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border); background: #fff;
    }
    .sidebar-header h2 { font-size: .95rem; font-weight: 700; flex: 1; }
    .search-box {
      padding: 8px 12px; border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 20px;
      font-size: .85rem; font-family: var(--font); outline: none; background: var(--bg);
      transition: border .15s;
    }
    .search-box input:focus { border-color: var(--acc); }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-list::-webkit-scrollbar { width: 4px; }
    .chat-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

    .chat-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f3f4f6;
      transition: background .12s; position: relative; user-select: none;
    }
    .chat-item:hover { background: var(--side-hover); }
    .chat-item.active { background: #e8f0fe; }
    .chat-item.active .chat-name { color: var(--acc); }

    .avatar {
      width: 46px; height: 46px; border-radius: 50%; background: var(--acc);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700; flex-shrink: 0; overflow: hidden;
      position: relative;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .avatar-sm { width: 36px; height: 36px; font-size: .8rem; }
    .avatar-xs { width: 28px; height: 28px; font-size: .7rem; }

    .chat-meta { flex: 1; min-width: 0; }
    .chat-row { display: flex; align-items: baseline; gap: 6px; }
    .chat-name { font-weight: 600; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .chat-time { font-size: .72rem; color: var(--subtle); white-space: nowrap; }
    .chat-preview { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .badge {
      background: var(--acc); color: #fff; border-radius: 50px;
      font-size: .65rem; font-weight: 700; padding: 2px 7px;
      min-width: 18px; text-align: center; flex-shrink: 0;
    }
    .badge-red { background: var(--red); }

    /* ── Chat area ── */
    .chat-area {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      position: relative;
    }
    .chat-area-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--muted); gap: 12px; text-align: center; padding: 24px;
    }
    .chat-area-empty svg { opacity: .3; }
    .chat-area-empty h3 { font-size: 1.1rem; font-weight: 600; color: var(--text); }
    .chat-area-empty p { font-size: .85rem; max-width: 280px; line-height: 1.5; }

    /* bg */
    .chat-bg {
      position: absolute; inset: 0; z-index: 0;
      background: #e5ddd5;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c8b8a0' fill-opacity='0.3'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .chat-bg.bg-none { background: var(--bg); background-image: none; }
    .chat-bg.bg-custom { background-size: cover; background-position: center; background-image: none; }

    .chat-header {
      height: var(--header-h); background: #fff; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
      flex-shrink: 0; z-index: 2; position: relative;
    }
    .chat-header .chat-info { flex: 1; min-width: 0; }
    .chat-header .chat-info .name { font-weight: 700; font-size: .92rem; }
    .chat-header .chat-info .status { font-size: .75rem; color: var(--muted); }

    .messages-wrap {
      flex: 1; overflow-y: auto; padding: 16px 6%; display: flex; flex-direction: column;
      gap: 4px; position: relative; z-index: 1;
    }
    .messages-wrap::-webkit-scrollbar { width: 4px; }
    .messages-wrap::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 4px; }

    /* Date separator */
    .date-sep {
      text-align: center; margin: 10px 0;
      font-size: .72rem; color: var(--muted);
    }
    .date-sep span {
      background: rgba(255,255,255,.85); border-radius: 10px;
      padding: 3px 10px; display: inline-block; backdrop-filter: blur(4px);
    }

    /* Message bubble */
    .msg-row { display: flex; flex-direction: column; max-width: 72%; }
    .msg-row.out { align-self: flex-end; align-items: flex-end; }
    .msg-row.in  { align-self: flex-start; align-items: flex-start; }
    .msg-row.system { align-self: center; max-width: 90%; }

    .bubble {
      padding: 7px 11px 5px; border-radius: 10px;
      font-size: .875rem; line-height: 1.45; position: relative;
      word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,.12);
    }
    .out .bubble { background: var(--msg-out); border-bottom-right-radius: 2px; }
    .in  .bubble { background: var(--msg-in);  border-bottom-left-radius: 2px; }
    .system .bubble { background: rgba(255,255,255,.82); font-size: .75rem; color: var(--muted); border-radius: 10px; text-align: center; padding: 4px 12px; }

    .bubble .reply-preview {
      border-left: 3px solid var(--acc); padding: 4px 8px; margin-bottom: 6px;
      border-radius: 4px; background: rgba(0,0,0,.06); font-size: .78rem;
      color: var(--muted); cursor: pointer;
    }
    .bubble .reply-preview .reply-name { font-weight: 600; color: var(--acc); font-size: .78rem; }

    .msg-footer {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 4px; margin-top: 2px;
    }
    .msg-time { font-size: .66rem; color: var(--subtle); }
    .tick { font-size: .8rem; line-height: 1; }
    .tick.sent   { color: #94a3b8; }
    .tick.delivered { color: #94a3b8; }
    .tick.read   { color: #60a5fa; }

    /* Input area */
    .input-area {
      background: #f0f2f5; border-top: 1px solid var(--border);
      padding: 10px 12px; display: flex; flex-direction: column;
      gap: 6px; z-index: 2; position: relative; flex-shrink: 0;
    }
    .reply-bar {
      display: none; background: #fff; border-left: 3px solid var(--acc);
      padding: 6px 10px; border-radius: 6px; font-size: .8rem;
      color: var(--muted); align-items: center; gap: 8px;
    }
    .reply-bar.show { display: flex; }
    .reply-bar .reply-name { font-weight: 600; color: var(--acc); }
    .reply-bar .reply-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reply-bar button { background: 0; border: none; cursor: pointer; color: var(--subtle); font-size: 1rem; }

    .input-row { display: flex; align-items: flex-end; gap: 8px; }
    .msg-input {
      flex: 1; border: none; outline: none; resize: none;
      border-radius: 20px; background: #fff; padding: 9px 14px;
      font-size: .875rem; font-family: var(--font); line-height: 1.4;
      max-height: 120px; overflow-y: auto;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .send-btn {
      width: 42px; height: 42px; border-radius: 50%; background: var(--acc);
      border: none; cursor: pointer; display: flex; align-items: center;
      justify-content: center; color: #fff; transition: background .15s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--acc2); }
    .send-btn:disabled { background: #c4c4c4; cursor: default; }

    /* ── Modals / Panels ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 100; display: none; align-items: center; justify-content: center;
    }
    .overlay.open { display: flex; }
    .panel {
      background: #fff; border-radius: 16px; padding: 24px; width: 90%; max-width: 420px;
      max-height: 90vh; overflow-y: auto; position: relative;
    }
    .panel h3 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
    .panel-close {
      position: absolute; top: 16px; right: 16px; background: 0; border: none;
      cursor: pointer; color: var(--muted); font-size: 1.2rem;
    }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
    .field input, .field textarea, .field select {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: .875rem; font-family: var(--font); outline: none;
      transition: border .15s;
    }
    .field input:focus, .field textarea:focus { border-color: var(--acc); }
    .field textarea { resize: vertical; min-height: 60px; }
    .toggle-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .toggle-row label { font-size: .875rem; flex: 1; }
    .toggle {
      width: 42px; height: 24px; border-radius: 12px; background: #d1d5db;
      position: relative; cursor: pointer; transition: background .2s; border: none;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--acc); }
    .toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%; background: #fff;
      transition: transform .2s;
    }
    .toggle.on::after { transform: translateX(18px); }

    .btn { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: .875rem; font-family: var(--font); transition: .15s; }
    .btn-primary { background: var(--acc); color: #fff; }
    .btn-primary:hover { background: var(--acc2); }
    .btn-ghost { background: 0; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover { background: var(--red2); }
    .btn-sm { padding: 6px 12px; font-size: .8rem; }
    .btn-row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

    /* search results */
    .search-results { margin-top: 10px; }
    .search-result-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; border-radius: 8px; cursor: pointer;
      transition: background .12s;
    }
    .search-result-item:hover { background: var(--bg); }
    .search-result-item .name { font-weight: 600; font-size: .875rem; }
    .search-result-item .email { font-size: .75rem; color: var(--muted); }

    /* Profile pic preview */
    .pic-preview {
      width: 72px; height: 72px; border-radius: 50%; background: var(--acc);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 700; margin: 0 auto 14px; overflow: hidden;
      cursor: pointer; position: relative;
    }
    .pic-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .pic-preview .edit-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; opacity: 0; transition: opacity .15s;
    }
    .pic-preview:hover .edit-overlay { opacity: 1; }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1f2937; color: #fff; padding: 10px 20px; border-radius: 10px;
      font-size: .85rem; z-index: 9999; opacity: 0; pointer-events: none;
      transition: opacity .2s; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* blocked notice */
    .blocked-bar {
      background: #fef2f2; border-top: 1px solid #fecaca;
      padding: 10px 16px; font-size: .82rem; color: var(--red2);
      text-align: center; display: none; flex-shrink: 0; z-index: 2; position: relative;
    }
    .blocked-bar.show { display: block; }

    /* ── Mobile ── */
    @media (max-width: 680px) {
      .sidebar { width: 100%; max-width: 100%; flex-shrink: 0; }
      .chat-area { display: none; }
      .sidebar.hidden { display: none; }
      .chat-area.visible { display: flex; width: 100%; }
      .back-btn { display: flex; }
    }

    /* nav link back to dashboard */
    .dash-link {
      font-size: .8rem; color: var(--muted); text-decoration: none; display: flex;
      align-items: center; gap: 4px; font-weight: 600;
    }
    .dash-link:hover { color: var(--acc); }

    /* empty inbox */
    .empty-inbox {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 32px 24px; text-align: center; color: var(--muted);
      gap: 10px;
    }
    .empty-inbox svg { opacity: .25; }

    /* No account found warning */
    .warn { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 12px; font-size: .8rem; color: #92400e; margin-top: 6px; }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <a class="topbar-logo" href="/~">
    <img src="/images/logo.png" alt="Fundo Plus">
    <span>Fundo Plus</span>
  </a>
  <span class="topbar-title">Messenger</span>
  <div class="topbar-right">
    <button class="icon-btn" id="newChatBtn" title="New conversation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
    <button class="icon-btn" id="settingsBtn" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
    <a class="dash-link" href="/~">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Dashboard
    </a>
  </div>
</div>

<!-- Main -->
<div class="messenger">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="avatar avatar-sm" id="myAvatar">?</div>
      <h2 id="myName">Loading…</h2>
    </div>
    <div class="search-box">
      <input type="text" id="inboxSearch" placeholder="Search conversations…">
    </div>
    <div class="chat-list" id="chatList">
      <div class="empty-inbox">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <p style="font-size:.82rem">No conversations yet. Tap + to start one.</p>
      </div>
    </div>
  </div>

  <!-- Chat area -->
  <div class="chat-area" id="chatArea">
    <div class="chat-area-empty" id="emptyState">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <h3>Select a conversation</h3>
      <p>Choose from your existing chats or start a new one by tapping +</p>
    </div>

    <div id="activeChatView" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
      <!-- Chat header -->
      <div class="chat-header">
        <button class="icon-btn back-btn" id="backBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="avatar avatar-sm" id="chatAvatar">?</div>
        <div class="chat-info">
          <div class="name" id="chatHeaderName">–</div>
          <div class="status" id="chatHeaderStatus"></div>
        </div>
        <button class="icon-btn" id="chatMenuBtn" title="More options">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
      </div>

      <!-- BG layer -->
      <div class="chat-bg" id="chatBg"></div>

      <!-- Messages -->
      <div class="messages-wrap" id="messagesWrap"></div>

      <!-- Blocked notice -->
      <div class="blocked-bar" id="blockedBar">
        You have blocked this person. <button class="btn btn-sm btn-ghost" onclick="unblockFromBar()" style="margin-left:8px">Unblock</button>
      </div>

      <!-- Input -->
      <div class="input-area" id="inputArea">
        <div class="reply-bar" id="replyBar">
          <div>
            <div class="reply-name" id="replyName"></div>
            <div class="reply-text" id="replyText"></div>
          </div>
          <button onclick="clearReply()">✕</button>
        </div>
        <div class="input-row">
          <textarea class="msg-input" id="msgInput" placeholder="Type a message…" rows="1"></textarea>
          <button class="send-btn" id="sendBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ── New Chat Modal ── -->
<div class="overlay" id="newChatOverlay">
  <div class="panel">
    <button class="panel-close" onclick="closeOverlay('newChatOverlay')">✕</button>
    <h3>New Conversation</h3>
    <div class="field">
      <label>Search by name or email</label>
      <input type="text" id="newChatSearch" placeholder="Name or email…">
    </div>
    <div class="search-results" id="newChatResults"></div>
    <div class="warn" id="newChatWarn" style="display:none"></div>
  </div>
</div>

<!-- ── Settings Modal ── -->
<div class="overlay" id="settingsOverlay">
  <div class="panel">
    <button class="panel-close" onclick="closeOverlay('settingsOverlay')">✕</button>
    <h3>Messenger Settings</h3>

    <div class="pic-preview" id="picPreview" onclick="document.getElementById('picUrlInput').focus()">
      <div class="edit-overlay">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </div>
    </div>

    <div class="field">
      <label>Profile Picture URL</label>
      <input type="url" id="picUrlInput" placeholder="https://…">
    </div>
    <div class="field">
      <label>Username (shown instead of real name)</label>
      <input type="text" id="usernameInput" maxlength="32" placeholder="e.g. @genius_zim">
    </div>
    <div class="field">
      <label>Bio</label>
      <textarea id="bioInput" maxlength="120" placeholder="Short bio…"></textarea>
    </div>

    <div class="toggle-row">
      <label>Allow others to find me by search</label>
      <button class="toggle" id="profilePublicToggle" onclick="toggleSetting('profilePublicToggle')"></button>
    </div>

      <label>Chat background</label>
      <select id="bgTypeSelect">
        <option value="default">Default (pattern)</option>
        <option value="none">None (plain)</option>
        <option value="custom">Custom image</option>
      </select>
    </div>
    <div class="field" id="bgUrlField" style="display:none">
      <label>Background image URL</label>
      <input type="url" id="bgUrlInput" placeholder="https://…">
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeOverlay('settingsOverlay')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<!-- ── Chat Menu (block etc) ── -->
<div class="overlay" id="chatMenuOverlay">
  <div class="panel" style="max-width:300px">
    <button class="panel-close" onclick="closeOverlay('chatMenuOverlay')">✕</button>
    <h3 id="chatMenuTitle">Options</h3>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
      <button class="btn btn-ghost" id="blockUnblockBtn" onclick="toggleBlock()">Block</button>
      <button class="btn btn-danger" onclick="clearLocalChat()">Clear chat history</button>
      <button class="btn btn-ghost" onclick="closeOverlay('chatMenuOverlay')">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════
const TOKEN = localStorage.getItem('fp_session');
if (!TOKEN) location.href = '/login';

let me = null;               // { id, displayName, email, settings }
let inbox = {};              // { [userId]: { id, displayName, profilePicUrl, email, messages:[], unread:0, blocked:false } }
let activeChatId = null;     // userId of open chat
let replyTo = null;          // { msgId, name, text }
let drainInterval = null;

const LS_INBOX = 'fp_messenger_inbox_v2';
const LS_SETTINGS = 'fp_messenger_settings';

// ══════════════════════════════════════════════════════
//  API HELPERS
// ══════════════════════════════════════════════════════
async function api(method, path, body) {
  const opts = { method, headers: { 'x-session-token': TOKEN } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  return r.json();
}

// ══════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════
async function init() {
  try {
    const r = await api('GET', '/api/messenger/me');
    if (!r.ok) { location.href = '/login'; return; }
    me = r;
    applyBackground(me.settings);
    renderMyAvatar();
    document.getElementById('myName').textContent = me.displayName || me.email;
  } catch { showToast('Connection error'); return; }

  loadInboxFromStorage();
  renderInbox();
  await drainMessages();
  drainInterval = setInterval(drainMessages, 20000); // drain every 20s
}

function renderMyAvatar() {
  const el = document.getElementById('myAvatar');
  if (me.settings?.profilePicUrl) {
    el.innerHTML = `<img src="${esc(me.settings.profilePicUrl)}" onerror="this.style.display='none'">`;
  }
  el.textContent = el.querySelector('img') ? '' : initials(me.displayName || me.email);
}

// ══════════════════════════════════════════════════════
//  LOCAL STORAGE PERSISTENCE
// ══════════════════════════════════════════════════════
function loadInboxFromStorage() {
  try {
    const raw = localStorage.getItem(LS_INBOX);
    if (raw) inbox = JSON.parse(raw);
    // ensure structure
    for (const uid in inbox) {
      inbox[uid].messages = inbox[uid].messages || [];
      inbox[uid].unread = inbox[uid].unread || 0;
    }
  } catch { inbox = {}; }
}

function saveInboxToStorage() {
  try { localStorage.setItem(LS_INBOX, JSON.stringify(inbox)); } catch {}
}

// ══════════════════════════════════════════════════════
//  DRAIN PENDING MESSAGES FROM SERVER
// ══════════════════════════════════════════════════════
async function drainMessages() {
  try {
    const r = await api('GET', '/api/messenger/drain');
    if (!r.ok || !r.messages.length) return;

    // Group by sender
    const grouped = {};
    r.messages.forEach(m => {
      if (!grouped[m.from]) grouped[m.from] = [];
      grouped[m.from].push(m);
    });

    // Need user info for senders we haven't seen
    const unknownIds = Object.keys(grouped).filter(id => !inbox[id]);
    if (unknownIds.length) {
      const info = await api('POST', '/api/messenger/user-info', { ids: unknownIds });
      if (info.ok) {
        info.users.forEach(u => {
          if (!inbox[u.id]) inbox[u.id] = mkContact(u);
        });
      }
    }

    let newMsgCount = 0;
    for (const [fromId, msgs] of Object.entries(grouped)) {
      if (!inbox[fromId]) inbox[fromId] = mkContact({ id: fromId, displayName: fromId, profilePicUrl: '', email: '' });
      msgs.forEach(m => {
        // Avoid duplicates
        if (!inbox[fromId].messages.find(x => x.id === m.id)) {
          inbox[fromId].messages.push({
            id: m.id, clientId: m.clientId || null,
            text: m.text, sentAt: m.sentAt,
            dir: 'in', status: 'read', replyTo: null,
          });
          if (fromId !== activeChatId) {
            inbox[fromId].unread = (inbox[fromId].unread || 0) + 1;
          }
          newMsgCount++;
        }
      });
    }

    if (newMsgCount) {
      saveInboxToStorage();
      renderInbox();
      if (activeChatId && grouped[activeChatId]) renderMessages();
    }
  } catch {}
}

// ══════════════════════════════════════════════════════
//  INBOX RENDER
// ══════════════════════════════════════════════════════
function mkContact(u) {
  return { id: u.id, displayName: u.displayName, profilePicUrl: u.profilePicUrl || '', email: u.email, messages: [], unread: 0, blocked: false };
}

function renderInbox() {
  const list = document.getElementById('chatList');
  const q = document.getElementById('inboxSearch').value.toLowerCase();
  const contacts = Object.values(inbox).filter(c => {
    if (!q) return true;
    return (c.displayName || '').toLowerCase().includes(q) || (c.email || '').toLowerCase().includes(q);
  });

  // Sort by most recent message
  contacts.sort((a, b) => {
    const ta = a.messages[a.messages.length - 1]?.sentAt || '';
    const tb = b.messages[b.messages.length - 1]?.sentAt || '';
    return tb.localeCompare(ta);
  });

  if (!contacts.length) {
    list.innerHTML = `<div class="empty-inbox">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <p style="font-size:.82rem">${q ? 'No results' : 'No conversations yet. Tap + to start one.'}</p>
    </div>`;
    return;
  }

  list.innerHTML = contacts.map(c => {
    const last = c.messages[c.messages.length - 1];
    const preview = last ? (last.dir === 'out' ? '✓ ' : '') + last.text.slice(0, 60) : 'Tap to chat';
    const time = last ? fmtTime(last.sentAt) : '';
    const badge = c.unread > 0 ? `<span class="badge">${c.unread > 99 ? '99+' : c.unread}</span>` : '';
    return `<div class="chat-item${activeChatId === c.id ? ' active' : ''}" onclick="openChat('${c.id}')">
      ${avatarHtml(c, 'avatar')}
      <div class="chat-meta">
        <div class="chat-row">
          <span class="chat-name">${esc(c.displayName)}</span>
          <span class="chat-time">${time}</span>
        </div>
        <div class="chat-row" style="margin-top:2px">
          <span class="chat-preview">${esc(preview)}</span>
          ${badge}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════
//  OPEN CHAT
// ══════════════════════════════════════════════════════
function openChat(userId) {
  activeChatId = userId;
  const c = inbox[userId];
  if (!c) return;

  // Mark unread 0
  c.unread = 0;
  saveInboxToStorage();
  renderInbox();

  // Header
  document.getElementById('chatHeaderName').textContent = c.displayName;
  document.getElementById('chatHeaderStatus').textContent = c.email;
  const avEl = document.getElementById('chatAvatar');
  if (avEl) setAvatarEl(avEl, c);
  document.getElementById('chatMenuBtn').dataset.uid = userId;

  // Blocked state
  refreshBlockedBar(c);

  // Show active chat
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('activeChatView').style.display = 'flex';

  renderMessages();

  // Mobile: hide sidebar
  document.getElementById('sidebar').classList.add('hidden');
  document.getElementById('chatArea').classList.add('visible');

  clearReply();
  document.getElementById('msgInput').focus();
  scrollToBottom();
}

function refreshBlockedBar(c) {
  const bar = document.getElementById('blockedBar');
  if (c.blocked) {
    bar.classList.add('show');
    document.getElementById('inputArea').style.display = 'none';
  } else {
    bar.classList.remove('show');
    document.getElementById('inputArea').style.display = '';
  }
}

// ══════════════════════════════════════════════════════
//  RENDER MESSAGES
// ══════════════════════════════════════════════════════
function renderMessages() {
  const c = inbox[activeChatId];
  if (!c) return;
  const wrap = document.getElementById('messagesWrap');
  if (!c.messages.length) {
    wrap.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:.8rem;margin-top:32px">Say hello! 👋</div>`;
    return;
  }

  let html = '';
  let lastDate = '';
  c.messages.forEach(msg => {
    const d = new Date(msg.sentAt);
    const dateStr = fmtDate(d);
    if (dateStr !== lastDate) {
      html += `<div class="date-sep"><span>${dateStr}</span></div>`;
      lastDate = dateStr;
    }
    html += renderBubble(msg, c);
  });
  wrap.innerHTML = html;
  scrollToBottom();
}

function renderBubble(msg, contact) {
  const isOut = msg.dir === 'out';
  const time = new Date(msg.sentAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  let tickHtml = '';
  if (isOut) {
    const s = msg.status || 'sending';
    if (s === 'sending')   tickHtml = `<span class="tick sent" title="Sending">🕐</span>`;
    else if (s === 'sent') tickHtml = `<span class="tick sent" title="Sent">✓</span>`;
    else if (s === 'delivered') tickHtml = `<span class="tick delivered" title="Delivered">✓✓</span>`;
    else if (s === 'read') tickHtml = `<span class="tick read" title="Read">✓✓</span>`;
  }

  let replyHtml = '';
  if (msg.replyTo) {
    const orig = contact.messages.find(m => m.id === msg.replyTo.msgId) || null;
    replyHtml = `<div class="reply-preview" onclick="scrollToMsg('${esc(msg.replyTo.msgId)}')">
      <div class="reply-name">${esc(msg.replyTo.name)}</div>
      <div>${esc((orig?.text || msg.replyTo.text || '').slice(0, 80))}</div>
    </div>`;
  }

  return `<div class="msg-row ${isOut ? 'out' : 'in'}" id="msg-${msg.id}" ondblclick="startReply('${msg.id}')">
    <div class="bubble">
      ${replyHtml}
      ${esc(msg.text)}
      <div class="msg-footer">
        <span class="msg-time">${time}</span>
        ${tickHtml}
      </div>
    </div>
  </div>`;
}

function scrollToMsg(msgId) {
  const el = document.getElementById('msg-' + msgId);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function scrollToBottom() {
  const w = document.getElementById('messagesWrap');
  w.scrollTop = w.scrollHeight;
}

// ══════════════════════════════════════════════════════
//  SEND MESSAGE
// ══════════════════════════════════════════════════════
async function sendMessage() {
  const text = document.getElementById('msgInput').value.trim();
  if (!text || !activeChatId) return;
  const c = inbox[activeChatId];
  if (!c) return;

  const clientId = `cl-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const tempMsg = {
    id: clientId, clientId,
    text, sentAt: new Date().toISOString(),
    dir: 'out', status: 'sending',
    replyTo: replyTo ? { msgId: replyTo.msgId, name: replyTo.name, text: replyTo.text } : null,
  };

  c.messages.push(tempMsg);
  document.getElementById('msgInput').value = '';
  clearReply();
  autoResize();
  renderMessages();
  saveInboxToStorage();

  try {
    const r = await api('POST', '/api/messenger/send', { to: activeChatId, text, clientId });
    if (r.ok) {
      // Replace temp with real
      const idx = c.messages.findIndex(m => m.id === clientId);
      if (idx !== -1) {
        c.messages[idx].id = r.message.id;
        c.messages[idx].status = 'sent';
      }
    } else if (r.error === 'blocked') {
      c.messages = c.messages.filter(m => m.id !== clientId);
      showToast('This user has blocked you.');
    } else {
      const idx = c.messages.findIndex(m => m.id === clientId);
      if (idx !== -1) c.messages[idx].status = 'sending';
      showToast('Failed to send: ' + (r.error || 'Unknown error'));
    }
  } catch {
    showToast('Network error. Message not sent.');
    c.messages = c.messages.filter(m => m.id !== clientId);
  }

  saveInboxToStorage();
  renderMessages();
}

// Reply
function startReply(msgId) {
  const c = inbox[activeChatId];
  if (!c) return;
  const msg = c.messages.find(m => m.id === msgId);
  if (!msg) return;
  const name = msg.dir === 'out' ? 'You' : c.displayName;
  replyTo = { msgId: msg.id, name, text: msg.text };
  document.getElementById('replyName').textContent = name;
  document.getElementById('replyText').textContent = msg.text.slice(0, 80);
  document.getElementById('replyBar').classList.add('show');
  document.getElementById('msgInput').focus();
}

function clearReply() {
  replyTo = null;
  document.getElementById('replyBar').classList.remove('show');
}

// ══════════════════════════════════════════════════════
//  NEW CHAT
// ══════════════════════════════════════════════════════
function openNewChat() {
  document.getElementById('newChatSearch').value = '';
  document.getElementById('newChatResults').innerHTML = '';
  document.getElementById('newChatWarn').style.display = 'none';
  openOverlay('newChatOverlay');
  setTimeout(() => document.getElementById('newChatSearch').focus(), 100);
}

let newChatDebounce;
document.getElementById('newChatSearch').addEventListener('input', () => {
  clearTimeout(newChatDebounce);
  newChatDebounce = setTimeout(searchUsers, 350);
});

async function searchUsers() {
  const q = document.getElementById('newChatSearch').value.trim();
  const warn = document.getElementById('newChatWarn');
  const results = document.getElementById('newChatResults');
  warn.style.display = 'none';

  if (!q) { results.innerHTML = ''; return; }

  // Try email exact match first
  if (q.includes('@')) {
    try {
      const r = await api('GET', `/api/messenger/user-by-email?email=${encodeURIComponent(q)}`);
      if (r.ok) {
        renderSearchResults([r.user]);
        return;
      }
    } catch {}
  }

  // Search by name
  try {
    const r = await api('GET', `/api/messenger/search?q=${encodeURIComponent(q)}`);
    if (r.ok) {
      if (!r.results.length) {
        results.innerHTML = '';
        warn.textContent = 'No users found. They may not have enabled public search in their settings.';
        warn.style.display = 'block';
      } else {
        renderSearchResults(r.results);
      }
    }
  } catch {}
}

function renderSearchResults(users) {
  const results = document.getElementById('newChatResults');
  results.innerHTML = users.map(u => `
    <div class="search-result-item" onclick="startChatWith(${JSON.stringify(u).replace(/"/g, '&quot;')})">
      ${avatarHtml(u, 'avatar avatar-sm')}
      <div>
        <div class="name">${esc(u.displayName)}</div>
        <div class="email">${esc(u.email)}</div>
      </div>
    </div>
  `).join('');
}

function startChatWith(user) {
  if (!inbox[user.id]) inbox[user.id] = mkContact(user);
  closeOverlay('newChatOverlay');
  openChat(user.id);
}

// ══════════════════════════════════════════════════════
//  BLOCK / UNBLOCK
// ══════════════════════════════════════════════════════
async function toggleBlock() {
  const c = inbox[activeChatId];
  if (!c) return;
  const action = c.blocked ? 'unblock' : 'block';
  await api('POST', `/api/messenger/${action}/${activeChatId}`);
  c.blocked = !c.blocked;
  saveInboxToStorage();
  refreshBlockedBar(c);
  closeOverlay('chatMenuOverlay');
  showToast(c.blocked ? 'User blocked' : 'User unblocked');
}

async function unblockFromBar() {
  const c = inbox[activeChatId];
  if (!c) return;
  await api('POST', `/api/messenger/unblock/${activeChatId}`);
  c.blocked = false;
  saveInboxToStorage();
  refreshBlockedBar(c);
  showToast('User unblocked');
}

function clearLocalChat() {
  if (!activeChatId) return;
  if (!confirm('Clear chat history? This only affects your device.')) return;
  inbox[activeChatId].messages = [];
  saveInboxToStorage();
  renderMessages();
  closeOverlay('chatMenuOverlay');
  showToast('Chat cleared');
}

// ══════════════════════════════════════════════════════
//  SETTINGS
// ══════════════════════════════════════════════════════
function openSettings() {
  const s = me.settings || {};
  document.getElementById('usernameInput').value = s.username || '';
  document.getElementById('bioInput').value = s.bio || '';
  document.getElementById('picUrlInput').value = s.profilePicUrl || '';
  document.getElementById('bgTypeSelect').value = s.bgType || 'default';
  document.getElementById('bgUrlInput').value = s.bgUrl || '';
  document.getElementById('bgUrlField').style.display = s.bgType === 'custom' ? '' : 'none';
  setToggle('profilePublicToggle', !!s.profilePublic);
  updatePicPreview(s.profilePicUrl || '', me.displayName);
  openOverlay('settingsOverlay');
}

document.getElementById('bgTypeSelect').addEventListener('change', function() {
  document.getElementById('bgUrlField').style.display = this.value === 'custom' ? '' : 'none';
});

document.getElementById('picUrlInput').addEventListener('input', function() {
  updatePicPreview(this.value, me.displayName);
});

function updatePicPreview(url, name) {
  const el = document.getElementById('picPreview');
  if (url) {
    el.innerHTML = `<img src="${esc(url)}" onerror="this.parentElement.innerHTML='<span>${initials(name)}</span>'"><div class="edit-overlay"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>`;
  } else {
    el.innerHTML = `<span>${initials(name)}</span><div class="edit-overlay"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>`;
  }
}

async function saveSettings() {
  const patch = {
    username: document.getElementById('usernameInput').value.trim(),
    bio: document.getElementById('bioInput').value.trim(),
    profilePicUrl: document.getElementById('picUrlInput').value.trim(),
    profilePublic: isToggleOn('profilePublicToggle'),
    bgType: document.getElementById('bgTypeSelect').value,
    bgUrl: document.getElementById('bgUrlInput').value.trim(),
  };
  const r = await api('PATCH', '/api/messenger/settings', patch);
  if (r.ok) {
    me.settings = r.settings;
    me.displayName = r.settings.username || me.displayName;
    document.getElementById('myName').textContent = me.displayName;
    renderMyAvatar();
    applyBackground(r.settings);
    closeOverlay('settingsOverlay');
    showToast('Settings saved');
  } else {
    showToast('Failed to save');
  }
}

// ══════════════════════════════════════════════════════
//  BACKGROUND
// ══════════════════════════════════════════════════════
function applyBackground(settings) {
  const bg = document.getElementById('chatBg');
  if (!bg) return;
  const type = settings?.bgType || 'default';
  bg.className = 'chat-bg';
  if (type === 'none') {
    bg.classList.add('bg-none');
  } else if (type === 'custom' && settings?.bgUrl) {
    bg.classList.add('bg-custom');
    bg.style.backgroundImage = `url('${esc(settings.bgUrl)}')`;
  }
  // default: keep the class as-is (patterned bg in CSS)
}

// ══════════════════════════════════════════════════════
//  OVERLAY / TOGGLE HELPERS
// ══════════════════════════════════════════════════════
function openOverlay(id) { document.getElementById(id).classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }
function toggleSetting(id) {
  const el = document.getElementById(id);
  el.classList.toggle('on');
}
function setToggle(id, on) {
  const el = document.getElementById(id);
  el.classList.toggle('on', on);
}
function isToggleOn(id) { return document.getElementById(id).classList.contains('on'); }

// ══════════════════════════════════════════════════════
//  UTILITY
// ══════════════════════════════════════════════════════
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function initials(name) {
  const parts = (name || '?').trim().split(/\s+/);
  return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
}
function avatarHtml(c, cls) {
  if (c.profilePicUrl) return `<div class="${cls}" style="background:#e2e8f0"><img src="${esc(c.profilePicUrl)}" onerror="this.style.display='none'">${initials(c.displayName)}</div>`;
  const colors = ['#2563eb','#7c3aed','#db2777','#ea580c','#16a34a','#0891b2'];
  const col = colors[(c.displayName || 'A').charCodeAt(0) % colors.length];
  return `<div class="${cls}" style="background:${col}">${initials(c.displayName)}</div>`;
}
function setAvatarEl(el, c) {
  const tmp = document.createElement('div');
  tmp.innerHTML = avatarHtml(c, el.className || 'avatar avatar-sm');
  const newEl = tmp.firstChild;
  if (el.parentNode) el.parentNode.replaceChild(newEl, el);
}
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  const diff = (now - d) / 86400000;
  if (diff < 7) return d.toLocaleDateString([], { weekday: 'short' });
  return d.toLocaleDateString([], { day:'2-digit', month:'2-digit' });
}
function fmtDate(d) {
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return 'Today';
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { day:'numeric', month:'short', year:'numeric' });
}
function showToast(msg, dur = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}
function autoResize() {
  const el = document.getElementById('msgInput');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ══════════════════════════════════════════════════════
//  EVENT BINDINGS
// ══════════════════════════════════════════════════════
document.getElementById('newChatBtn').addEventListener('click', openNewChat);
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('chatArea').classList.remove('visible');
  activeChatId = null;
});
document.getElementById('chatMenuBtn').addEventListener('click', () => {
  if (!activeChatId) return;
  const c = inbox[activeChatId];
  document.getElementById('chatMenuTitle').textContent = c?.displayName || 'Options';
  document.getElementById('blockUnblockBtn').textContent = c?.blocked ? 'Unblock' : 'Block';
  openOverlay('chatMenuOverlay');
});
document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('msgInput').addEventListener('input', autoResize);
document.getElementById('inboxSearch').addEventListener('input', renderInbox);

// Click outside overlays to close
document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
});

// ══════════════════════════════════════════════════════
//  START
// ══════════════════════════════════════════════════════
init();
</script>
