<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <title>Messenger — Fundo Plus</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --primary:#2563eb;
      --bubble-sent:#2563eb;--bubble-received:#f1f5f9;
      --bg:#f8fafc;--surface:#ffffff;--border:#e2e8f0;
      --text:#0f172a;--muted:#64748b;
    }
    html,body{height:100%;font-family:'Inter',system-ui;background:var(--bg);color:var(--text);overflow:hidden}
    
    .topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;justify-content:space-between}
    .logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--primary);text-decoration:none}
    
    .msngr{display:flex;flex:1;height:calc(100vh - 60px);overflow:hidden}
    
    .sidebar{width:320px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
    .sidebar-header{padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:center}
    .search-box{position:relative;margin:0 20px 16px}
    .search-box input{width:100%;padding:10px 16px 10px 40px;border:1px solid var(--border);border-radius:9999px;background:#f8fafc;font-size:0.9rem}
    
    .chat-list{flex:1;overflow-y:auto}
    .chat-item{display:flex;align-items:center;gap:14px;padding:14px 20px;cursor:pointer;border-bottom:1px solid #f1f5f9}
    .chat-item:hover{background:#f8fafc}
    .chat-item.active{background:#eff6ff}
    .chat-avatar{width:48px;height:48px;border-radius:50%;background:#2563eb;color:white;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
    .chat-info{flex:1;min-width:0}
    .chat-name{font-weight:600;font-size:0.95rem}
    .chat-preview{font-size:0.82rem;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    
    .chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
    .chat-header{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;justify-content:space-between}
    .chat-header-left{display:flex;align-items:center;gap:14px}
    .chat-header-avatar{width:42px;height:42px;border-radius:50%;background:#2563eb;color:white;display:flex;align-items:center;justify-content:center;font-weight:600}
    
    .messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:8px;background:#f8fafc}
    
    .message{display:flex;max-width:75%}
    .message.sent{align-self:flex-end}
    .message.received{align-self:flex-start}
    
    .bubble{padding:10px 16px;border-radius:18px;font-size:0.93rem;line-height:1.4}
    .message.sent .bubble{background:#2563eb;color:white;border-bottom-right-radius:6px}
    .message.received .bubble{background:white;border:1px solid #e2e8f0;border-bottom-left-radius:6px}
    
    .message-meta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:0.7rem;color:#94a3b8}
    .message.sent .message-meta{justify-content:flex-end}
    
    .ticks{font-size:0.75rem}
    .ticks.read{color:#3b82f6}
    
    .input-area{padding:16px 20px;background:white;border-top:1px solid var(--border);display:flex;gap:10px}
    .input-area input{flex:1;border:1px solid var(--border);border-radius:9999px;padding:12px 20px;font-size:0.95rem}
    .send-btn{width:44px;height:44px;border-radius:50%;background:#2563eb;color:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
    
    .empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#64748b}
    
    .modal{position:fixed;inset:0;background:rgba(15,23,42,0.6);display:none;align-items:center;justify-content:center;z-index:100}
    .modal.open{display:flex}
    .modal-content{background:white;border-radius:16px;width:90%;max-width:420px}
    
    .ctx-menu{position:fixed;background:white;border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.15);z-index:200;min-width:160px;display:none}
    .ctx-item{padding:12px 18px;font-size:0.9rem;cursor:pointer}
    .ctx-item:hover{background:#f8fafc}
    .ctx-item.danger{color:#dc2626}
    
    .status-text{font-size:0.75rem;color:#22c55e}
    .status-text.offline{color:#94a3b8}
    
    @media(max-width:700px){
      .sidebar{width:100%;position:absolute;z-index:10}
      .chat-area{display:none;position:absolute;inset:0;z-index:20;background:white}
      .chat-area.active{display:flex}
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="/~" class="logo">
      <img src="/images/logo.png" width="28" height="28" style="border-radius:8px">
      <span>Fundo Plus</span>
    </a>
  </div>
  <div style="display:flex;gap:8px">
    <button onclick="openNewChat()" style="width:36px;height:36px;border-radius:50%;background:#2563eb;color:white;border:none;font-size:20px">+</button>
    <button onclick="openSettings()" style="width:36px;height:36px;border-radius:50%;background:#64748b;color:white;border:none">⚙</button>
  </div>
</div>

<div class="msngr">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3 style="font-size:1.1rem">Chats</h3>
    </div>
    
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" placeholder="Search chats..." id="sidebarSearch" oninput="filterChats()">
    </div>
    
    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chatArea">
    <div class="chat-header">
      <div class="chat-header-left">
        <button onclick="backToList()" id="backBtn" style="background:none;border:none;font-size:1.6rem;color:#64748b;display:none">←</button>
        <div class="chat-header-avatar" id="chatAvatar">?</div>
        <div>
          <div class="ch-name" id="chName">Select a chat</div>
          <div class="status-text" id="chStatus"></div>
        </div>
      </div>
      <button onclick="openChatMenu()" style="background:none;border:none;font-size:1.4rem;color:#64748b">⋮</button>
    </div>
    
    <div class="messages" id="msgs"></div>
    
    <div class="input-area" id="inputArea" style="display:none">
      <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- New Chat Modal -->
<div class="modal" id="modalNewChat">
  <div class="modal-content">
    <div style="padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:center">
      <strong>New Conversation</strong>
      <button onclick="closeModal('modalNewChat')" style="background:none;border:none;font-size:1.8rem">×</button>
    </div>
    <div style="padding:0 20px 20px">
      <input type="text" id="searchInput" placeholder="Search by name or email..." style="width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;margin-bottom:16px" oninput="searchUsers()">
      <div id="searchResults"></div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal" id="modalSettings">
  <div class="modal-content">
    <div style="padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:center">
      <strong>Settings</strong>
      <button onclick="closeModal('modalSettings')" style="background:none;border:none;font-size:1.8rem">×</button>
    </div>
    <div style="padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:600">Public profile</div>
          <div style="font-size:0.8rem;color:#64748b">Allow others to find you by name</div>
        </div>
        <div class="toggle" id="togglePublic" onclick="togglePublic()"></div>
      </div>
    </div>
  </div>
</div>

<!-- Context Menus -->
<div class="ctx-menu" id="msgMenu">
  <div class="ctx-item" onclick="deleteMessage()">Delete Message</div>
</div>

<div class="ctx-menu" id="chatMenu">
  <div class="ctx-item" onclick="editContact()">Edit Contact</div>
  <div class="ctx-item" onclick="deleteContact()">Delete Contact</div>
  <div class="ctx-item danger" onclick="toggleBlock()">Block / Unblock</div>
</div>

<script>
'use strict';

let TOKEN = localStorage.getItem('fp_session') || null;
let me = null;
let inbox = JSON.parse(localStorage.getItem('fp_msngr_inbox') || '{}');
let activeId = null;
let socket = null;

function saveInbox() {
  localStorage.setItem('fp_msngr_inbox', JSON.stringify(inbox));
}

async function api(method, url, body) {
  const opts = { method, headers: {}, credentials: 'include' };
  if (TOKEN) opts.headers['x-session-token'] = TOKEN;
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  if (res.status === 401 || res.status === 403) {
    window.location.href = '/login?redirect=/messenger';
    return { ok: false };
  }
  return await res.json().catch(() => ({}));
}

async function init() {
  const r = await api('GET', '/api/messenger/me');
  if (!r || !r.ok) {
    document.getElementById('myName').innerHTML = 'Please log in';
    return;
  }
  me = r;
  renderMyProfile();
  renderChatList();

  initSocket();
  setInterval(drainPendingMessages, 600);
  await drainPendingMessages();

  const first = Object.keys(inbox)[0];
  if (first) openChat(first);
}

function initSocket() {
  if (typeof io === 'undefined') {
    const s = document.createElement('script');
    s.src = 'https://cdn.socket.io/4.7.5/socket.io.min.js';
    s.onload = () => connectSocket();
    document.head.appendChild(s);
  } else {
    connectSocket();
  }
}

function connectSocket() {
  if (!me || socket) return;
  socket = io({ transports: ['websocket'] });
  socket.on('connect', () => socket.emit('messenger:join', me.id));
  socket.on('messenger:new-message', (msg) => {
    if (!msg || !msg.from) return;
    if (!inbox[msg.from]) inbox[msg.from] = { id: msg.from, displayName: msg.from, email: '', messages: [] };
    const c = inbox[msg.from];
    if (!c.messages) c.messages = [];
    if (!c.messages.find(m => m.id === msg.id)) {
      c.messages.push({ id: msg.id, text: msg.text, sentAt: msg.sentAt, dir: 'in', status: 'delivered' });
      saveInbox();
      renderChatList();
      if (activeId === msg.from) renderMessages();
    }
  });
}

async function drainPendingMessages() {
  try {
    const r = await api('GET', '/api/messenger/drain');
    if (r.ok && r.messages && r.messages.length > 0) {
      let changed = false;
      r.messages.forEach(m => {
        if (!inbox[m.from]) inbox[m.from] = { id: m.from, displayName: m.from, email: '', messages: [] };
        const c = inbox[m.from];
        if (!c.messages) c.messages = [];
        if (!c.messages.find(x => x.id === m.id)) {
          c.messages.push({ id: m.id, text: m.text, sentAt: m.sentAt, dir: 'in', status: 'delivered' });
          changed = true;
        }
      });
      if (changed) {
        saveInbox();
        renderChatList();
        if (activeId) renderMessages();
      }
    }
  } catch(e) {}
}

function renderMyProfile() {
  const nameEl = document.getElementById('myName');
  const bioEl = document.getElementById('myBio');
  const avEl = document.getElementById('myAv');

  if (nameEl) nameEl.textContent = me.displayName || me.email;
  if (bioEl) bioEl.textContent = me.email || '';
  if (avEl) {
    avEl.style.background = '#2563eb';
    avEl.textContent = (me.displayName || 'U')[0].toUpperCase();
  }
}

function renderChatList(filter = '') {
  const el = document.getElementById('chatList');
  let contacts = Object.values(inbox);
  
  if (filter) {
    contacts = contacts.filter(c => 
      (c.displayName || '').toLowerCase().includes(filter.toLowerCase()) ||
      (c.email || '').toLowerCase().includes(filter.toLowerCase())
    );
  }
  
  if (!contacts.length) {
    el.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><p>No conversations yet</p></div>`;
    return;
  }
  
  el.innerHTML = contacts.map(c => {
    const last = c.messages && c.messages.length ? c.messages[c.messages.length-1] : null;
    const prev = last ? last.text.slice(0, 40) : 'Tap to chat';
    const online = c.online ? `<span class="online-dot"></span>` : '';
    return `
      <div class="chat-item ${activeId === c.id ? 'active' : ''}" onclick="openChat('${c.id}')" oncontextmenu="showContactMenu(event, '${c.id}')">
        <div class="chat-avatar">${(c.displayName || 'U')[0]}</div>
        <div class="chat-info">
          <div class="chat-name">${c.displayName} ${online}</div>
          <div class="chat-preview">${prev}</div>
        </div>
      </div>`;
  }).join('');
}

function filterChats() {
  const q = document.getElementById('sidebarSearch').value;
  renderChatList(q);
}

function updateStatus() {
  const statusEl = document.getElementById('chStatus');
  const c = inbox[activeId];
  if (!c) return;
  
  if (c.online) {
    statusEl.innerHTML = `<span class="status-text">Online</span>`;
  } else if (c.lastSeen) {
    const time = new Date(c.lastSeen);
    const diff = Math.floor((new Date() - time) / 60000);
    statusEl.innerHTML = `<span class="status-text offline">Last seen ${diff < 1 ? 'just now' : diff + ' min ago'}</span>`;
  } else {
    statusEl.innerHTML = '';
  }
}

function openChat(id) {
  activeId = id;
  const c = inbox[id];
  if (!c) return;
  
  document.getElementById('chName').textContent = c.displayName;
  document.getElementById('chatAvatar').textContent = (c.displayName || 'U')[0];
  document.getElementById('inputArea').style.display = 'flex';
  document.getElementById('chatArea').classList.add('active');
  document.getElementById('sidebar').classList.remove('active');
  
  renderMessages();
  renderChatList();
  updateStatus();
  markMessagesAsRead(id);
}

function markMessagesAsRead(contactId) {
  const c = inbox[contactId];
  if (!c || !c.messages) return;
  
  let changed = false;
  c.messages.forEach(m => {
    if (m.dir === 'in' && m.status !== 'read') {
      m.status = 'read';
      changed = true;
    }
  });
  
  if (changed) {
    saveInbox();
    renderMessages();
    api('POST', `/api/messenger/mark-read/${contactId}`).catch(() => {});
  }
}

function renderMessages() {
  const el = document.getElementById('msgs');
  const c = inbox[activeId];
  if (!c || !c.messages || !c.messages.length) {
    el.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><p>Say hello 👋</p></div>`;
    return;
  }
  
  el.innerHTML = c.messages.map((m, index) => {
    const isOut = m.dir === 'out';
    let ticks = '';
    
    if (isOut) {
      if (m.status === 'read') {
        ticks = `<span class="ticks read">✓✓</span>`;
      } else if (m.status === 'delivered') {
        ticks = `<span class="ticks">✓✓</span>`;
      } else if (m.status === 'sent') {
        ticks = `<span class="ticks">✓</span>`;
      } else {
        ticks = `<span class="ticks">⏱</span>`;
      }
    }
    // Received messages (isOut = false) show NO ticks
    
    return `
      <div class="message ${isOut ? 'sent' : 'received'}" data-index="${index}" oncontextmenu="showMsgMenu(event, ${index})">
        <div class="bubble">${m.text}
          <div class="message-meta">
            <span>${new Date(m.sentAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
            ${ticks}
          </div>
        </div>
      </div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

async function sendMessage() {
  if (!activeId) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  const c = inbox[activeId];
  if (!c.messages) c.messages = [];
  
  const tempMsg = {
    id: 'local-' + Date.now(),
    text,
    sentAt: new Date().toISOString(),
    dir: 'out',
    status: 'sending'
  };
  
  c.messages.push(tempMsg);
  saveInbox();
  renderMessages();
  input.value = '';

  const r = await api('POST', '/api/messenger/send', { to: activeId, text });
  if (r.ok) {
    const idx = c.messages.findIndex(m => m.id === tempMsg.id);
    if (idx !== -1) {
      c.messages[idx].id = r.message?.id || tempMsg.id;
      c.messages[idx].status = 'sent';
    }
  } else {
    const idx = c.messages.findIndex(m => m.id === tempMsg.id);
    if (idx !== -1) c.messages[idx].status = 'failed';
    alert('Failed to send: ' + (r.error || 'Unknown error'));
  }
  saveInbox();
  renderMessages();
}

function showMsgMenu(e, index) {
  e.preventDefault();
  const menu = document.getElementById('msgMenu');
  menu.style.display = 'block';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.dataset.index = index;
  document.onclick = () => { menu.style.display = 'none'; document.onclick = null; };
}

function deleteMessage() {
  const menu = document.getElementById('msgMenu');
  const index = parseInt(menu.dataset.index);
  const c = inbox[activeId];
  if (!c || !c.messages) return;
  c.messages.splice(index, 1);
  saveInbox();
  renderMessages();
  menu.style.display = 'none';
}

function showContactMenu(e, id) {
  e.preventDefault();
  const menu = document.getElementById('chatMenu');
  menu.style.display = 'block';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.dataset.id = id;
  document.onclick = () => { menu.style.display = 'none'; document.onclick = null; };
}

function editContact() {
  const menu = document.getElementById('chatMenu');
  const id = menu.dataset.id;
  const c = inbox[id];
  if (!c) return;
  menu.style.display = 'none';
  const newName = prompt('Edit contact name:', c.displayName);
  if (newName && newName.trim()) {
    c.displayName = newName.trim();
    saveInbox();
    renderChatList();
    if (activeId === id) document.getElementById('chName').textContent = c.displayName;
  }
}

function deleteContact() {
  const menu = document.getElementById('chatMenu');
  const id = menu.dataset.id;
  if (!confirm('Delete this contact?')) return;
  menu.style.display = 'none';
  delete inbox[id];
  saveInbox();
  renderChatList();
  if (activeId === id) {
    activeId = null;
    document.getElementById('chatArea').classList.remove('active');
  }
}

async function toggleBlock() {
  const menu = document.getElementById('chatMenu');
  const id = menu.dataset.id;
  menu.style.display = 'none';
  const c = inbox[id];
  if (!c) return;
  const action = c.blocked ? 'unblock' : 'block';
  const r = await api('POST', `/api/messenger/${action}/${id}`);
  if (r.ok) {
    c.blocked = !c.blocked;
    saveInbox();
    alert(c.blocked ? 'User blocked' : 'User unblocked');
  }
}

function openNewChat() {
  document.getElementById('modalNewChat').classList.add('open');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
  searchUsers();
  document.getElementById('searchInput').oninput = () => searchUsers();
}

async function searchUsers() {
  const q = document.getElementById('searchInput').value.trim();
  const container = document.getElementById('searchResults');
  container.innerHTML = `<div style="padding:20px;text-align:center">Searching...</div>`;
  
  let results = [];
  try {
    if (q.includes('@')) {
      const r = await api('GET', `/api/messenger/user-by-email?email=${encodeURIComponent(q)}`);
      if (r.ok && r.user) results = [r.user];
    } else {
      const r = await api('GET', `/api/messenger/search?q=${encodeURIComponent(q)}`);
      if (r.ok) results = r.results || [];
    }
  } catch(e) {}
  
  if (!results.length) {
    container.innerHTML = `<div style="padding:20px;text-align:center;color:#888">No users found</div>`;
    return;
  }
  
  container.innerHTML = results.map(u => `
    <div class="chat-item" onclick="startChat('${u.id}', '${u.displayName}', '${u.email}')">
      <div class="chat-avatar">${(u.displayName || 'U')[0]}</div>
      <div class="chat-info">
        <div class="chat-name">${u.displayName}</div>
        <div class="chat-preview">${u.email}</div>
      </div>
    </div>
  `).join('');
}

function startChat(id, name, email) {
  closeModal('modalNewChat');
  if (!inbox[id]) {
    inbox[id] = { id, displayName: name, email: email || '', messages: [], unread: 0 };
    saveInbox();
    renderChatList();
  }
  openChat(id);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

async function openSettings() {
  document.getElementById('modalSettings').classList.add('open');
  try {
    const r = await api('GET', '/api/messenger/settings');
    const isPublic = r.ok && r.settings ? r.settings.profilePublic !== false : true;
    const tog = document.getElementById('togglePublic');
    tog.classList.toggle('on', isPublic);
    tog.dataset.value = isPublic;
  } catch(e) {}
}

async function togglePublic() {
  const tog = document.getElementById('togglePublic');
  const current = tog.dataset.value === 'true';
  const newVal = !current;
  tog.classList.toggle('on', newVal);
  tog.dataset.value = newVal;
  try {
    await api('PATCH', '/api/messenger/settings', { profilePublic: newVal });
  } catch(e) { alert('Failed to save'); }
}

function backToList() {
  document.getElementById('chatArea').classList.remove('active');
  document.getElementById('sidebar').classList.add('active');
  activeId = null;
  renderChatList();
}

function checkMobile() {
  const backBtn = document.getElementById('backBtn');
  backBtn.style.display = window.innerWidth <= 700 ? 'block' : 'none';
}
window.addEventListener('resize', checkMobile);
checkMobile();

init();
</script>
</body>
